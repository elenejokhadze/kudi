const announced = new Set();
const saveFired = () => lsSet('kudi.fired', JSON.stringify({day:today(), map:fired}));
const saveRem = () => lsSet('kudi.rem', JSON.stringify(REM));

function pendingReminders(){
  if (!S || ui.ob) return [];
  const t = today(), now = hmToMin(nowHM()), lead = +REM.lead || 0, pet = S.pet.name || 'your pet', out = [];
  if (REM.meals) [...S.meals].sort((a,b)=>hmToMin(a.time)-hmToMin(b.time)).forEach(m => {
    if (!mealFed(S, m.id, t) && now >= hmToMin(m.time) - lead)
      out.push({key:`meal:${m.id}:${t}`, icon:'bowl', title:`${m.name} time for ${pet}`, text: m.food ? `${m.food}${m.portion?` · ${m.portion}`:''} · due ${m.time}` : `Due at ${m.time}`, act:{a:'feed', id:m.id, label:'Mark as fed'}});
  });
  if (REM.meds) S.meds.filter(m=>medActive(m,t)).forEach(m => (m.times||[]).forEach(time => {
    if (!doseLog(S, m, time, t) && now >= hmToMin(time) - lead)
      out.push({key:`med:${m.id}:${time}:${t}`, icon:'pill', title:`${m.name}${m.dose?` ${m.dose}`:''} for ${pet}`, text:`Dose due at ${time}${m.notes?` · ${m.notes}`:''}`, act:{a:'give', id:m.id, time, label:'Given'}});
  }));
  if (REM.vacc) S.vaccines.forEach(v => {
    if (!v.due) return; const d = diffDays(t, v.due);
    if (d <= 7) out.push({key:`vac:${v.id}:${t}`, icon:'syringe', title: d < 0 ? `${v.name} is overdue` : d === 0 ? `${v.name} is due today` : `${v.name} due in ${d} day${d===1?'':'s'}`, text:`Book a vet visit for ${pet}`, act:{a:'remGo', tab:'health', seg:'vaccines', label:'Open vaccines'}});
  });
  if (REM.heat && showHeat()){ const H = heatInfo();
    if (H.next && diffDays(t, H.next) <= 7) out.push({key:`heat:next:${t}`, icon:'heart', title:`${pet}'s heat may start soon`, text:`Expected around ${fmtS(H.next)}. Keep her away from male ${H.sp==='cat'?'cats':'dogs'}.`, act:{a:'remGo', tab:'health', seg:'heat', label:'Open heat'}});
    if (H.watchUntil){ const day = diffDays(t, H.watchUntil); if (day % 7 === 0) out.push({key:`heat:watch:${t}`, icon:'alert', title:`Weekly check on ${pet}`, text:'Drinking a lot, tired, discharge or swollen belly? See a vet today.', act:{a:'remGo', tab:'health', seg:'heat', label:'Open heat'}}); }
  }
  if (REM.trips) S.trips.forEach(tr => tr.steps.forEach(s => {
    if (s.done || !s.due) return; const d = diffDays(t, s.due);
    if (d <= 3) out.push({key:`step:${s.id}:${t}`, icon:'plane', title: d < 0 ? `Late: ${s.title}` : `${s.title} by ${fmtS(s.due)}`, text:`Trip to ${tr.place || DESTS[tr.dest].label} on ${fmtS(tr.date)}`, act:{a:'remTrip', trip:tr.id, label:'Open trip'}});
  }));
  return out.filter(r => { const f = fired[r.key]; return !(f === 'done' || (typeof f === 'number' && Date.now() < f)); });
}
let actx = null;
document.addEventListener('pointerdown', () => { if (actx) return; try { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); } catch(e){} }, true);
function chime(){
  if (!REM.sound || !actx) return;
  try {
    if (actx.state === 'suspended') actx.resume();
    [[659.25,0],[880,0.16],[1046.5,0.32]].forEach(([f,t0]) => {
      const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f;
      const t = actx.currentTime + t0; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.4);
    });
  } catch(e){}
}
function checkReminders(){
  const list = pendingReminders();
  const fresh = list.filter(r => !announced.has(r.key));
  fresh.forEach(r => announced.add(r.key));
  const changed = list.length !== remQ.length || list.some((r,i) => !remQ[i] || remQ[i].key !== r.key);
  remQ = list;
  if (fresh.length){ chime(); buzz();
    if (CAN_NOTIFY && REM.push && Notification.permission === 'granted') navigator.serviceWorker.ready.then(reg => fresh.forEach(r => reg.showNotification(r.title, {body:r.text, tag:r.key, icon:'/icon-192.png', badge:'/icon-192.png'}))).catch(()=>{});
  }
  drawBanner();
  if (changed && !inRender && S && !ui.ob && !ui.sheet) render({keepScroll:true});
  document.title = remQ.length ? `(${remQ.length}) Kudi Pet Care` : 'Kudi Pet Care';
}
function drawBanner(){
  const box = document.getElementById('rem'); if (!box) return;
  const r = remQ[0];
  if (!r || ui.sheet){ box.innerHTML = ''; box.dataset.key = ''; return; }
  if (box.dataset.key === r.key + ':' + remQ.length) return;
  box.dataset.key = r.key + ':' + remQ.length;
  const actAttrs = Object.entries(r.act).filter(([k]) => k !== 'label' && k !== 'a').map(([k,v]) => `data-${k}="${esc(v)}"`).join(' ');
  box.innerHTML = `<div class="rem" role="alert">
    <div class="row" style="align-items:flex-start">
      <span class="badge-ico sun bellwrap">${ic(r.icon)}</span>
      <div class="grow"><div class="eyebrow">Reminder${remQ.length>1?` · 1 of ${remQ.length}`:''}</div><div class="t">${esc(r.title)}</div><div class="s">${esc(r.text)}</div></div>
      <button class="iconbtn sm" data-a="remDismiss" data-key="${esc(r.key)}" aria-label="Dismiss reminder">${ic('x','ico-s')}</button>
    </div>
    <div class="acts">
      <button class="btn sun sm" data-a="remAct" data-key="${esc(r.key)}" data-do="${esc(r.act.a)}" ${actAttrs}>${ic('check','ico-s')}${esc(r.act.label)}</button>
      <button class="btn soft sm" data-a="remSnooze" data-key="${esc(r.key)}">${ic('clock','ico-s')}Snooze 15 min</button>
    </div>
  </div>`;
}
function gcal(title, dateKey, time, mins, details, recur){
  const [h, m] = time.split(':').map(Number);
  const s = parseKey(dateKey); s.setHours(h, m, 0, 0);
  const e = new Date(s.getTime() + mins * 60000);
  const g = x => `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  let tz = 'Asia/Tbilisi'; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch(e){}
  const q = new URLSearchParams({action:'TEMPLATE', text:title, dates:`${g(s)}/${g(e)}`, details, ctz:tz});
  if (recur) q.set('recur', 'RRULE:' + recur);
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}
function remindPage(cal){
  const t = today(), now = hmToMin(nowHM()), pet = S.pet.name || 'your pet';
  let opened = {}; try { opened = JSON.parse(lsGet('kudi.cal') || '{}'); } catch(e){}
  const sw = (k, label, sub) => `<label class="li" style="cursor:pointer" for="rem_${k}"><div class="grow"><div class="t">${label}</div><div class="s">${sub}</div></div><input type="checkbox" class="switch" id="rem_${k}" data-rem="${k}" ${REM[k]?'checked':''}></label>`;
  // calendar links
  const rows = [];
  S.meals.forEach(m => { const start = hmToMin(m.time) <= now ? addDays(t,1) : t;
    rows.push({k:'meal:'+m.id, icon:'bowl', title:`${m.name} · every day`, when:m.time,
      href: gcal(`Feed ${pet}: ${m.name}`, start, m.time, 10, `${m.food?`${m.food}${m.portion?`, ${m.portion}`:''}. `:''}Tap Mark as fed in Kudi so the family knows.`, 'FREQ=DAILY')}); });
  S.meds.forEach(m => { const end = addDays(m.start, Math.max(1,m.days)-1); if (end < t) return;
    const start = m.start > t ? m.start : t; const count = diffDays(start, end) + 1;
    (m.times||[]).forEach(time => rows.push({k:'med:'+m.id+time, icon:'pill', title:`${m.name}${m.dose?` ${m.dose}`:''}`, when:`${time} · ${count} day${count===1?'':'s'}`,
      href: gcal(`${pet}: ${m.name}${m.dose?` ${m.dose}`:''}`, start, time, 5, `${m.notes?m.notes+'. ':''}${m.vet?`Prescribed by ${m.vet}. `:''}Tap Given in Kudi.`, `FREQ=DAILY;COUNT=${count}`)})); });
  S.vaccines.forEach(v => { if (!v.due || v.due < t) return; const remindOn = addDays(v.due, -7) > t ? addDays(v.due, -7) : t;
    rows.push({k:'vac:'+v.id+v.due, icon:'syringe', title:`${v.name}`, when:`Due ${fmtS(v.due)} · alert a week before`,
      href: gcal(`Book ${v.name} for ${pet}`, remindOn, '10:00', 15, `${v.name} is due on ${fmt(v.due)}. Call the vet to book.`)}); });
  if (showHeat()){ const H = heatInfo(); if (H.next){ const on = addDays(H.next, -7) > t ? addDays(H.next, -7) : t;
    rows.push({k:'heat:'+H.next, icon:'heart', title:`${pet}'s next heat`, when:`Around ${fmtS(H.next)} · alert a week before`, href: gcal(`${pet}'s heat may start soon`, on, '10:00', 15, `Expected around ${fmt(H.next)}. Log it in Kudi when it starts.`)}); } }
  S.trips.forEach(tr => tr.steps.forEach(s => { if (s.done || !s.due || s.due < t) return;
    rows.push({k:'step:'+s.id, icon:'plane', title:s.title, when:`By ${fmtS(s.due)} · trip ${fmtS(tr.date)}`,
      href: gcal(`${pet}'s trip: ${s.title}`, s.due, '10:00', 15, `${s.detail||''} Trip to ${tr.place||DESTS[tr.dest].label} on ${fmt(tr.date)}.`)}); }));
  const head = (t, back) => `<header class="top trip-top"><button class="iconbtn" data-a="${back?'openReminders':'closeReminders'}" data-back="1" aria-label="${back?'Back to Reminders':'Back to Me'}">${ic('back')}</button><h1 class="grow">${t}</h1></header>`;
  if (cal) return `${head('Add to phone calendar', true)}
    <div class="stack" style="margin-top:var(--space-4)">
      <p class="small muted" style="margin:0">Each one opens Google Calendar with the time and repeat filled in. Tap Save there, and your phone reminds you even when Kudi is closed.</p>
      ${rows.length?`<div class="list calrow">${rows.map(r=>`<div class="li"><span class="badge-ico" style="width:36px;height:36px;border-radius:var(--radius-md)">${ic(r.icon,'ico-s')}</span><div class="grow"><div class="t">${esc(r.title)}</div><div class="s num">${esc(r.when)}</div></div><a class="btn ${opened[r.k]?'ghost':'soft'} sm" href="${esc(r.href)}" target="_blank" rel="noopener" data-cal="${esc(r.k)}">${opened[r.k]?ic('check','ico-s')+'Added':'Add'}</a></div>`).join('')}</div>`:'<div class="empty">Add meal times, medicine or vaccines first.</div>'}
    </div>`;
  return `${head('Reminders')}
    <div class="stack" style="margin-top:var(--space-4)">
      <div class="eyebrow">Remind me about</div>
      <div class="list">
        ${sw('meals','Meals','When a meal is due and nobody has fed yet')}
        ${sw('meds','Medicine','Each dose the vet prescribed')}
        ${sw('vacc','Vaccines','A week before the due date')}
        ${sw('trips','Trips','Three days before each checklist step')}
        ${showHeat()?sw('heat','Heat','A week before her next heat'):''}
      </div>
      <div class="eyebrow" style="margin-top:var(--space-2)">How</div>
      <div class="list">
        <div class="li"><label class="grow" for="rem_lead"><div class="t">When</div><div class="s">For meals and medicine</div></label>
          <select class="in" id="rem_lead" data-rem="lead" style="width:auto">${[[0,'At the time'],[10,'10 min before'],[30,'30 min before']].map(([v,l])=>`<option value="${v}" ${+REM.lead===v?'selected':''}>${l}</option>`).join('')}</select></div>
        ${sw('sound','Sound','A short chime')}
        ${CAN_NOTIFY ? (Notification.permission === 'granted' ? sw('push','Phone notifications','While Kudi is running') : `<div class="li"><div class="grow"><div class="t">Phone notifications</div><div class="s">${Notification.permission==='denied' ? 'Blocked in your browser settings.' : 'On iPhone, add Kudi to the Home Screen first.'}</div></div>${Notification.permission==='denied' ? '' : '<button class="btn soft sm" data-a="allowNotify">Allow</button>'}</div>`) : ''}
        <button class="li li-btn" data-a="openCalendar"><div class="grow"><div class="t">Add to phone calendar</div><div class="s">Reminders even when Kudi is closed</div></div>${ic('right','ico-s')}</button>
      </div>
    </div>`;
}
Object.assign(A, {
  week(d){ ui.week = Math.max(-8, Math.min(0, (ui.week||0) + (+d.d))); render({keepScroll:true}); },
  pat(d, ev){ ui.flash = 'pat'; burst(ev, 12); buzz(); const lines = [`${S.pet.name} loves you`, 'Tail wags: maximum', 'Best human ever', 'More scratches, please']; toast(lines[Math.floor(Math.random()*lines.length)]); render({keepScroll:true}); },
  remAct(d, ev){
    fired[d.key] = 'done'; saveFired();
    if (d.do === 'feed') A.feed({id:d.id}, ev);
    else if (d.do === 'give') A.give({id:d.id, time:d.time}, ev);
    else if (d.do === 'remGo') A.go({tab:d.tab, seg:d.seg});
    else if (d.do === 'remTrip'){ ui.tab = TRIP_TAB(); ui.tripId = d.trip; render({anim:true, top:true}); }
    checkReminders();
  },
  remSnooze(d){ fired[d.key] = Date.now() + 15*60000; saveFired(); announced.delete(d.key); checkReminders(); toast('Snoozed for 15 minutes'); },
  remDismiss(d){ fired[d.key] = 'done'; saveFired(); checkReminders(); }
});

/* ---------- family sync on the web (Vercel API) ---------- */
function newCode(){ const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let x = ''; const r = new Uint32Array(12); try { crypto.getRandomValues(r); } catch(e){ for (let i=0;i<12;i++) r[i] = Math.random()*1e9; } for (let i=0;i<12;i++) x += c[r[i] % c.length]; return x; }
async function startHttpSync(){
  if (MVP) return; // MVP keeps records on this phone; family sync comes back with a server
  if (location.protocol === 'file:') return;
  if (!subscribed) return;
  const qp = new URLSearchParams(location.search), joined = (qp.get('home') || '').toLowerCase();
  if (joined && /^[a-z0-9]{8,24}$/.test(joined)){
    if (lsGet(LSHOME) !== joined){ lsSet(LSHOME, joined); S = null; lsDel(LS); lsDel(LSME); me = null; ui.ob = null; }
    history.replaceState(null, '', location.pathname);
  }
  homeCode = lsGet(LSHOME) || newCode(); lsSet(LSHOME, homeCode);
  const url = '/api/household?id=' + homeCode;
  const get = async () => { const r = await fetch(url, {cache:'no-store'}); if (r.status === 501){ dbMissing = true; throw new Error('no-db'); } if (!r.ok) throw new Error('http ' + r.status); return (await r.json()).data; };
  let data;
  try { data = await get(); } catch(e){ if (S && !ui.ob && ui.tab === 'me') render({keepScroll:true}); return; }
  syncMode = 'shared';
  remote = {
    push: d => fetch(url, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({data:d})}).then(r => { if (!r.ok) throw new Error('http ' + r.status); }),
    del: () => fetch(url, {method:'DELETE'})
  };
  if (!S && !data) render();
  applyRemote(data, true);
  const poll = async () => { if (document.hidden || !remote) return; try { const d = await get(); if (d && JSON.stringify(d) !== lastPushed) applyRemote(d, false); } catch(e){} };
  setInterval(poll, 8000);
  document.addEventListener('visibilitychange', poll);
}

/* ---------- boot ---------- */
(async function boot(){
  try {
  const raw = lsGet(LS);
  if (raw){ try { S = normalize(JSON.parse(raw)); } catch(e){ S = null; } }
  me = lsGet(LSME);
  subscribed = lsGet(LSSUB) === '1';
  if (MVP){ lang = 'en'; document.documentElement.dataset.theme = 'dark'; subscribed = true; const mc = document.querySelector('meta[name="theme-color"]'); if (mc) mc.content = getComputedStyle(document.documentElement).getPropertyValue('--color-bg').trim(); }
  else {
    const savedLang = lsGet(LSLANG); if (savedLang && STRINGS[savedLang]) lang = savedLang;
    const savedTheme = lsGet('kudi.theme'); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  }
  const tab = lsGet(LSTAB); if (tab && TABS().includes(tab)) ui.tab = tab;
  if (S && !S.members.find(m=>m.id===me)) me = S.members[0] && S.members[0].id;

  if (MVP){
    // Google sign-in: a pet you already set up opens straight away once you are signed in
    await Promise.race([initAuth().catch(()=>{}), new Promise(res => setTimeout(res, 4000))]);
    if (S && !S.sample && !signedIn()) ui.ob = newOb();
  }
  // Auth check: if Supabase is configured and user is not logged in/skipped, show auth screen
  else if (AUTH_CONFIGURED && lsGet('kudi.authskip') !== '1'){
    try {
      const authed = await Promise.race([
        initAuth(),
        new Promise(res => setTimeout(() => res(false), 4000)) // 4s timeout fallback
      ]);
      if (!authed){ renderAuthScreen(); return; }
    } catch(e){ /* auth failed: fall through to app */ }
  } else if (AUTH_CONFIGURED){
    initAuth().catch(()=>{}); // init silently for session tracking
  }

  render(); appBooted = true;
  if (!IN_ARTIFACT) startHttpSync();
  if (CAN_NOTIFY) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  // live sync through the artifact's shared store, when the viewer offers it
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('db').then(d => {
      if (!d) return;
      db = d;
      try { ref = db.doc('households/home'); } catch(e){ ref = null; return; }
      syncMode = 'shared';
      remote = {push: d => ref.set(d), del: () => ref.delete()};
      let first = true;
      ref.onSnapshot(snap => {
        const data = snap.exists ? snap.data() : null;
        if (data && !first && JSON.stringify(data) === lastPushed) return;
        const f = first; first = false;
        applyRemote(data, f);
      }, () => { syncMode = 'device'; ref = null; remote = null; if (S && !ui.ob) render({keepScroll:true}); });
      if (S && !ui.ob && ui.tab === 'me') render({keepScroll:true});
    }).catch(()=>{});
  }
  // Listen for auth state changes (magic link redirect)
  if (sbClient) sbClient.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session){ currentUser = session.user; history.replaceState(null,'',location.pathname + location.search.replace(/[?&]code=[^&]*/,'')); if (MVP && ui.ob) afterSignIn(); else render({keepScroll:true}); }
    if (event === 'SIGNED_OUT'){ currentUser = null; }
  });

  // refresh "late" states every minute
  setInterval(() => { if (S && !ui.ob && !ui.sheet && ui.tab === 'today') render({keepScroll:true}); }, 60000);
  // check for due reminders every 20 seconds and whenever the app comes back to the screen
  setInterval(checkReminders, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkReminders(); });
  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-cal]'); if (!a) return;
    let o = {}; try { o = JSON.parse(lsGet('kudi.cal') || '{}'); } catch(err){}
    o[a.dataset.cal] = Date.now(); lsSet('kudi.cal', JSON.stringify(o));
    setTimeout(() => { a.classList.remove('soft'); a.classList.add('ghost'); a.innerHTML = ic('check','ico-s') + 'Opened'; }, 300);
  });
  } catch(bootErr){ console.error('Boot error:', bootErr); render(); } // safety net: always render
})();

})();
