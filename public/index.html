/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-header);background:color-mix(in srgb,var(--color-bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-block:var(--space-4) var(--space-3);display:flex;align-items:center;gap:var(--space-3)}

.progress-card{gap:var(--space-4)}

/* pink details (Me): avatar rings, people avatars, a pink tile for the family upsell */
.badge-ico.pink{background:var(--color-pink-soft);color:var(--color-pink-strong)}

/* sections + cards */

.card.col{flex-direction:column;align-items:stretch}

.btn{border:0;border-radius:var(--radius-pill);min-height:var(--tap-min);padding:0 var(--space-5);font:var(--type-title);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);transition:transform .12s ease, background .2s;white-space:nowrap}

.btn.xl{min-height:var(--tap-lg)}

.list{background:var(--color-surface);border-radius:var(--radius-lg);border:var(--stroke-hair) solid var(--color-line);padding:0 var(--space-4)}

.empty{border:var(--stroke-ui) dashed var(--color-line-strong);border-radius:var(--radius-lg);padding:var(--space-5);text-align:center;color:var(--color-ink-2);font:var(--type-label);display:flex;flex-direction:column;gap:var(--space-3);align-items:center}

/* badges grid */
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3)}
.bdg{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);text-align:center;font:var(--type-caption);font-weight:var(--weight-semibold)}
.bdg .medal{width:56px;height:56px;border-radius:var(--radius-round);display:grid;place-items:center;background:var(--color-surface-2);color:var(--color-ink-3)}
.bdg.on .medal{background:var(--lime-100);color:var(--forest-700)}
.bdg:not(.on){color:var(--color-ink-3)}

/* bottom tab bar */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(var(--layout-max),100%);padding:var(--space-2) var(--space-3) calc(var(--space-3) + env(safe-area-inset-bottom,0px));z-index:var(--z-tabbar);pointer-events:none}
.nav-in{pointer-events:auto;background:color-mix(in srgb,var(--color-surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:var(--stroke-hair) solid var(--color-line);border-radius:var(--radius-lg);box-shadow:var(--shadow-3);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:var(--space-1)}
.nav button{border:0;background:transparent;border-radius:var(--radius-md);min-height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-px);font:var(--type-micro);color:var(--color-ink-3);position:relative}

.nav button[aria-current="page"]{color:var(--color-ink)}
.nav .dot{position:absolute;top:var(--space-2);right:calc(50% - 18px);width:9px;height:9px;border-radius:var(--radius-round);background:var(--color-pink-strong);border:2px solid var(--color-surface)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--color-scrim);z-index:var(--z-scrim);animation:fade .2s ease}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(var(--layout-max),100%);max-height:var(--sheet-max-h);overflow:auto;background:var(--color-sheet);border-top:var(--stroke-hair) solid var(--color-line);box-shadow:var(--shadow-3);border-radius:var(--radius-xl) var(--radius-xl) 0 0;z-index:var(--z-sheet);padding:var(--space-3) var(--space-5) calc(var(--space-6) + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.9,.2,1)}
/* inside a raised sheet, cards and fields step up with it (older names too, used by inline styles) */
.sheet:not(.takeover),.modal-in{--color-surface:var(--color-sheet);--card:var(--color-sheet);--color-surface-2:var(--color-sheet-field);--tint:var(--color-sheet-field);--tint2:var(--color-sheet-field)}
.sheet.takeover{top:0;max-height:none;border-radius:0;border-top:0;box-shadow:none;background:var(--color-bg);animation:pgin .32s cubic-bezier(.4,0,.2,1);padding-top:calc(var(--space-3) + env(safe-area-inset-top,0px))}
.sheet.takeover{display:flex;flex-direction:column;gap:var(--space-2)}
.sheet.takeover > *{flex-shrink:0}
/* content sits in the middle, actions sit at the bottom */
.sheet.takeover > .btn:first-of-type,.sheet.takeover > .pm-btns{margin-top:auto !important}
/* on a takeover the actions own the bottom edge, so toasts drop in from the top */
body:has(.sheet.takeover) .toast{bottom:auto;top:calc(var(--space-16) + env(safe-area-inset-top,0px))}
.sheet.takeover .chat-wrap{flex:1;height:auto;min-height:0}
.unread-dot{width:10px;height:10px;border-radius:var(--radius-round);background:var(--color-pink-strong);flex:none}
.iconbtn.has-dot{position:relative}
body[data-screen="today"] .top .iconbtn.has-dot{border:0}
body[data-screen="today"] .top .iconbtn.has-dot .unread-dot{border-color:var(--art-home-ground)}
.iconbtn.has-dot .unread-dot{position:absolute;top:0;right:0;width:14px;height:14px;box-sizing:border-box;border:2px solid var(--color-bg)}
.new-pill{flex:none;background:var(--color-pink);color:var(--color-on-pink);border-radius:var(--radius-pill);padding:var(--space-px) var(--space-2);font:var(--type-caption);font-weight:var(--weight-semibold)}
.pm-stack{display:flex;flex:none}
.pm-stack .av{width:36px;height:36px;border-radius:var(--radius-round);overflow:hidden;box-shadow:0 0 0 2px var(--color-surface)}
.pm-stack .av + .av{margin-left:-12px}
.pm-stack .av.more{display:grid;place-items:center;background:var(--color-surface-3);color:var(--color-ink);font:var(--type-caption);font-weight:var(--weight-semibold)}
.pm-stack .av img{width:100%;height:100%;object-fit:cover}
.scrim:has(+ .sheet.takeover){display:none}
/* swipe page: the profile card sits in the middle of the free space, actions stay at the bottom */
.sheet.takeover > .pm-card{margin-block:auto}
.sheet.takeover > .pm-card ~ .pm-btns{margin-top:0 !important}
.sheet.takeover.stay{animation:none}
@keyframes pgin{from{opacity:0;transform:translate(-26%,0)}to{opacity:1;transform:translate(-50%,0)}}
.pm-page{display:flex;flex-direction:column;gap:var(--space-2);min-height:calc(100dvh - var(--tabbar-h) - var(--space-16));padding-top:calc(var(--space-3) + env(safe-area-inset-top,0px))}
.pm-page > *{flex-shrink:0}
.pm-page > .btn:first-of-type,.pm-page > .pm-btns{margin-top:auto !important}
.pm-page > .pm-card{margin-block:auto}
.pm-page > .pm-card ~ .pm-btns{margin-top:0 !important}
.pm-page .chat-wrap{flex:1;height:auto;min-height:0}
body:has(.pm-page) .toast{bottom:auto;top:calc(var(--space-16) + env(safe-area-inset-top,0px))}
/* Calendar: week strip, then the day's agenda */
.cal-week{display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-2)}
.cal-month{font:var(--type-h3);margin:0}
.cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--space-1)}
.cal-day{border:var(--stroke-ui) solid transparent;background:transparent;border-radius:var(--radius-md);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-px);color:var(--color-ink);padding:var(--space-1) 0}
.cal-day .cal-dow{font:var(--type-caption);color:var(--color-ink-2)}
.cal-day .cal-num{font:var(--type-title)}
.cal-day.now{border-color:var(--color-line-strong)}
.cal-day[aria-pressed="true"]{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-bg)}
.cal-day[aria-pressed="true"] .cal-dow{color:var(--color-bg)}
.cal-dot{width:5px;height:5px;border-radius:var(--radius-round);background:transparent}
.cal-dot.on{background:var(--color-ink-2)}
.cal-day[aria-pressed="true"] .cal-dot.on{background:var(--color-bg)}
.cal-today:disabled{opacity:.4}
.navpill .cal-today{width:auto;padding:0 var(--space-3);border-radius:var(--radius-pill);font:var(--type-label);font-weight:var(--weight-semibold)}
.cal-open{border:0;background:transparent;padding:0;text-align:left;color:inherit;display:flex;flex-direction:column;gap:var(--space-px);min-width:0;min-height:var(--tap-min);justify-content:center}
.cal-open .t,.cal-open .s{display:block}
.pm-top{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2)}
.pm-top h1{font:var(--type-h2);margin:0}
.pm-hero{height:180px;margin:0 0 var(--space-4);border-radius:var(--radius-lg);background:var(--art-welcome-ground) url('art/pawmates-banner.jpg') center 30% / cover no-repeat}
.sheet .grab{width:44px;height:5px;border-radius:var(--radius-pill);background:var(--color-line-strong);margin:var(--space-1) auto var(--space-3)}
.sheet h2{font:var(--type-h2);margin-bottom:var(--space-3)}
.field{display:flex;flex-direction:column;gap:var(--space-1)}
.field label,.lbl{font:var(--type-label);font-weight:var(--weight-semibold);color:var(--color-ink-2)}
.in{min-height:var(--tap-min);border-radius:var(--radius-sm);border:var(--stroke-ui) solid var(--color-line);background:var(--color-surface-2);padding:0 var(--space-3);font:var(--type-body);font-size:var(--text-title);width:100%}
textarea.in{padding:var(--space-3);min-height:80px}
.in:focus{border-color:var(--color-ink);outline:none}
/* selects: our own chevron (Iconoir nav-arrow-down) with room on the right, instead of the browser's, which sits on the edge */
select.in{appearance:none;-webkit-appearance:none;padding-right:var(--space-10);background-image:var(--chevron);background-repeat:no-repeat;background-position:right var(--space-3) center;background-size:var(--icon-md) var(--icon-md)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.choice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.choice button{border:var(--stroke-ui) solid var(--color-line);background:var(--color-surface);border-radius:var(--radius-md);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);font:var(--type-label);font-weight:var(--weight-semibold)}
.choice button[aria-pressed="true"]{border-color:var(--color-ink);box-shadow:0 0 0 .5px var(--color-ink);color:var(--color-ink)}
/* the same option card as a radio, for choices inside forms */
.choice label.opt{position:relative;display:block;cursor:pointer}
.choice label.opt input{position:absolute;opacity:0;width:1px;height:1px}
.choice label.opt span{border:var(--stroke-ui) solid var(--color-line);background:var(--color-surface);border-radius:var(--radius-md);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);font:var(--type-label);font-weight:var(--weight-semibold);color:var(--color-ink-2)}
.choice label.opt input:checked + span{border-color:var(--color-ink);box-shadow:0 0 0 .5px var(--color-ink);color:var(--color-ink)}
.choice label.opt input:focus-visible + span{outline:2px solid var(--color-ink);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}

.chip button{width:28px;height:28px;border-radius:var(--radius-round);border:0;background:var(--color-surface-2);display:grid;place-items:center}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;gap:var(--space-5);padding-block:var(--space-6) var(--space-8)}
.ob h1{font:var(--type-h1);letter-spacing:var(--tracking-tight)}
.dots{display:flex;gap:var(--space-1)}
.dots i{width:8px;height:8px;border-radius:var(--radius-pill);background:var(--color-surface-3);transition:width .3s,background .3s}
.dots i.on{width:24px;background:var(--color-ink)}
.splash{background:var(--art-ground);border-radius:var(--radius-xl);height:250px;position:relative;overflow:hidden;display:grid;place-items:center}
.splash .sunball{display:none}
.splash svg.mascot{position:relative;width:190px;height:190px;animation:bob 3s ease-in-out infinite}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2)}
.feat div{display:flex;align-items:center;gap:var(--space-2);background:var(--color-surface-2);border-radius:var(--radius-md);padding:var(--space-3);font:var(--type-label);font-weight:var(--weight-semibold)}

/* setup steps 1-3: a slim 3-part progress line, big species cards */
.ob-top{display:flex;align-items:center;gap:var(--space-4)}
.ob-progress{flex:1;height:4px;border-radius:var(--radius-pill);background:var(--color-surface-3);overflow:hidden}
.ob-progress i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--color-ink);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.species{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.species button{border:var(--stroke-ui) solid var(--color-line);background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-2) var(--space-2) var(--space-3);display:flex;flex-direction:column;align-items:center;gap:var(--space-3);font:var(--type-title);color:var(--color-ink);text-align:center}
.species button[aria-pressed="true"]{border-color:var(--color-ink);box-shadow:0 0 0 .5px var(--color-ink)}
.species .art{display:block;width:100%;aspect-ratio:4/5;border-radius:var(--radius-md);background:var(--art-welcome-ground);object-fit:cover;object-position:center top;overflow:hidden}
.species .art svg{width:100%;height:100%}
/* auth */
.auth-wrap{position:fixed;inset:0;background:var(--color-bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-8) var(--space-6);animation:fade .25s ease}
.auth-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:0}
.auth-logo{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-8)}
.auth-logo-icon{width:48px;height:48px;background:var(--color-primary);color:var(--color-on-primary);border-radius:var(--radius-md);display:grid;place-items:center;font-size:var(--text-h2)}
.auth-msg{background:var(--color-success-bg);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font:var(--type-label);font-weight:var(--weight-semibold);color:var(--color-success);margin-top:var(--space-3);display:none}
.auth-msg.show{display:block}
.auth-error{background:var(--color-danger-bg);color:var(--color-danger)}
.auth-divider{display:flex;align-items:center;gap:var(--space-3);margin:var(--space-4) 0;color:var(--color-ink-2);font:var(--type-caption);font-weight:var(--weight-semibold)}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--color-line)}

/* pawmates */
.pm-card{background:var(--color-surface);border-radius:var(--radius-lg);overflow:hidden;border:var(--stroke-hair) solid var(--color-line);transition:transform .15s}
.pm-photo{height:240px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pm-photo svg{width:190px;height:190px}
.pm-info{padding:var(--space-4) var(--space-4) var(--space-3)}
.pm-name{font:var(--type-h2);display:flex;align-items:center;gap:var(--space-1)}
.pm-g{display:inline-grid;color:var(--color-ink-2)}
.pm-btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-4)}
.pm-pass,.pm-like{border:0;border-radius:var(--radius-pill);min-height:var(--tap-lg);font-size:var(--text-h2);background:var(--color-surface-2);cursor:pointer;transition:transform .12s,background .15s}
.pm-pass:active,.pm-like:active{transform:scale(.94)}
.pm-swipe-r{animation:pmSwipeR .32s ease forwards}
.pm-swipe-l{animation:pmSwipeL .32s ease forwards}
@keyframes pmSwipeR{to{transform:translateX(130%) rotate(18deg);opacity:0}}
@keyframes pmSwipeL{to{transform:translateX(-130%) rotate(-18deg);opacity:0}}
.pm-match{text-align:center;padding:var(--space-2) 0 var(--space-1)}
.pm-match-avs{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:var(--space-4)}
.pm-match-av{width:80px;height:80px;border-radius:var(--radius-round);overflow:hidden;border:3px solid var(--color-surface);background:var(--art-ground)}
.pm-match-av+.pm-match-av{margin-left:-16px}
.pm-match-heart{width:36px;height:36px;border-radius:var(--radius-round);background:var(--color-pink-soft);display:grid;place-items:center;z-index:1;border:3px solid var(--color-surface);font-size:var(--text-title);margin:0 -4px}
.pm-tag{display:inline-flex;background:color-mix(in srgb,var(--color-surface) 85%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3);font:var(--type-micro);color:var(--color-ink)}
.pm-mascot{width:190px;height:190px;animation:bob 3.4s ease-in-out infinite}

/* chat */
.chat-wrap{display:flex;flex-direction:column;height:min(72vh,540px)}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-1) 0 var(--space-3)}
.chat-bubble{max-width:78%;padding:var(--space-2) var(--space-3);border-radius:var(--radius-lg);font:var(--type-body);word-break:break-word}
.chat-bubble.me{background:var(--lime-100);color:var(--forest-900);align-self:flex-end;border-bottom-right-radius:var(--radius-xs)}
.chat-bubble.them{background:var(--color-surface-2);color:var(--color-ink);align-self:flex-start;border-bottom-left-radius:var(--radius-xs)}
.chat-bubble.typing{opacity:.6}
.chat-ts{font:var(--type-caption);color:var(--color-ink-2);text-align:center;margin:var(--space-1) 0}
.chat-bar{display:flex;gap:var(--space-2);padding-top:var(--space-3);border-top:var(--stroke-hair) solid var(--color-line);margin-top:auto}
.chat-bar input{flex:1;min-height:var(--tap-min);border-radius:var(--radius-pill);border:var(--stroke-ui) solid var(--color-line);background:var(--color-surface-2);padding:0 var(--space-4);font:var(--type-body)}
.chat-bar input:focus{border-color:var(--color-ink);outline:none}
.chat-header{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.chat-av{width:42px;height:42px;border-radius:var(--radius-round);overflow:hidden;flex-shrink:0}
.match-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:var(--stroke-hair) solid var(--color-line);cursor:pointer}
.match-row:last-child{border-bottom:none}
.match-row .av{width:48px;height:48px;border-radius:var(--radius-round);overflow:hidden;flex-shrink:0}

/* subscription: a feature card */
.sub-hero{background:var(--color-feature);color:var(--color-on-feature);border-radius:var(--radius-lg);padding:var(--space-6) var(--space-5);text-align:center}
.sub-hero .price{font:var(--type-h1);color:var(--color-feature-title)}
.sub-hero .price sup{font-size:var(--text-title);vertical-align:super;letter-spacing:0}
.sub-hero .price sub{font-size:var(--text-title);vertical-align:baseline;color:var(--color-feature-ink-2)}
.sub-feats{display:flex;flex-direction:column;gap:var(--space-2);margin:var(--space-3) 0}
.sub-feats li{list-style:none;display:flex;align-items:center;gap:var(--space-3);font:var(--type-label);font-weight:var(--weight-semibold)}
.sub-badge{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--color-surface-3);color:var(--color-ink);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3);font:var(--type-caption);font-weight:var(--weight-semibold)}

/* champion state */
.ring.champion .face{background:var(--yellow-300)}
.ring.champion svg.track circle:last-child{stroke:var(--yellow-300)}
.bdg.champion-all{grid-column:1/-1;background:var(--yellow-50);border:var(--stroke-ui) solid var(--yellow-300);border-radius:var(--radius-lg);padding:var(--space-4);flex-direction:row;gap:var(--space-3);text-align:left;font:var(--type-label);font-weight:var(--weight-semibold);color:var(--color-ink)}
.bdg.champion-all .medal{background:var(--yellow-300);color:var(--forest-900);width:52px;height:52px;flex-shrink:0}

/* care report */
.report-stat{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) 0;border-bottom:var(--stroke-hair) solid var(--color-line)}
.report-stat:last-child{border-bottom:none}
.report-stat .lbl{font:var(--type-label);color:var(--color-ink-2)}
.report-stat .val{font:var(--type-title);font-weight:var(--weight-bold);font-variant-numeric:tabular-nums}

/* affiliate cards */
.aff-card{background:transparent;border:var(--stroke-hair) solid var(--color-line);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;align-items:flex-start;gap:var(--space-3)}
.aff-card .aff-tag{font:var(--type-micro);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-ink-2);margin-bottom:var(--space-px)}
.aff-links{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-2)}
.aff-links a{display:inline-flex;align-items:center;gap:var(--space-1);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-4);font:var(--type-label);font-weight:var(--weight-semibold);text-decoration:none;background:var(--color-surface);color:var(--color-ink)}
.aff-links a:hover{background:var(--color-surface-3)}

/* overlays: toast, xp float, confetti, badge modal */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--color-tooltip);color:var(--color-on-tooltip);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-4);font:var(--type-label);font-weight:var(--weight-semibold);z-index:var(--z-toast);display:flex;gap:var(--space-3);align-items:center;animation:toast 2.6s ease forwards;white-space:nowrap;max-width:calc(100% - 32px);box-shadow:var(--shadow-3)}
.toast button{border:0;background:var(--color-primary);color:var(--color-on-primary);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3);font:var(--type-label);font-weight:var(--weight-semibold)}
.xpfloat{position:fixed;z-index:45;pointer-events:none;font:var(--type-h3);font-weight:var(--weight-bold);color:var(--color-on-primary);background:var(--color-primary);padding:var(--space-px) var(--space-3);border-radius:var(--radius-pill);animation:float 1.1s ease-out forwards}
.bit{position:fixed;z-index:44;pointer-events:none;width:12px;height:12px}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:var(--space-6);background:var(--color-scrim);animation:fade .2s}
.modal-in{background:var(--color-sheet);border-radius:var(--radius-xl);padding:var(--space-6) var(--space-5);max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:var(--space-3);align-items:center;animation:popin .5s cubic-bezier(.2,1.5,.4,1)}
.modal-in .medal{width:96px;height:96px;border-radius:var(--radius-round);background:var(--color-surface-3);color:var(--color-ink);border:2px solid var(--color-ink);box-shadow:inset 0 0 0 4px var(--color-sheet);display:grid;place-items:center;animation:spin 1s ease}
.modal-in .medal svg{width:46px;height:46px}

/* reminder banner + switches */
#rem{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 78px);width:min(456px,calc(100% - 24px));z-index:30}
.rem{background:var(--color-sheet);border:var(--stroke-hair) solid var(--color-line-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-3);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);animation:drop .45s cubic-bezier(.2,1.3,.4,1)}
.rem .badge-ico,.rem .iconbtn,.rem .btn.soft{background:var(--color-sheet-field)}
.rem .btn.sun,.rem .btn.sun:hover{background:var(--color-primary);color:var(--color-on-primary)}
.rem .bellwrap{animation:ring 1.2s ease .3s 2}
.rem .acts{display:flex;gap:var(--space-2);flex-wrap:wrap}
.rem .acts .btn{flex:1;min-width:110px}
input.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:var(--radius-pill);background:var(--color-surface-3);position:relative;flex-shrink:0;cursor:pointer;transition:background .2s;margin:0}
input.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:var(--radius-round);background:var(--color-surface);box-shadow:var(--shadow-1);transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
input.switch:checked{background:var(--color-switch-on)}
input.switch:checked::after{background:var(--color-switch-knob-on)}
input.switch:checked::after{transform:translateX(20px)}
.calrow a.btn{text-decoration:none;white-space:nowrap}
@keyframes drop{from{transform:translateY(-120%);opacity:.001}to{transform:none;opacity:1}}
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(10deg)}40%{transform:rotate(-8deg)}50%{transform:rotate(4deg)}60%{transform:rotate(0)}}

/* today: stage, summary, insights, weekly */
.navpill{display:inline-flex;align-items:center;gap:var(--space-1);border:0;background:var(--color-surface-2);border-radius:var(--radius-pill);padding:var(--space-1);min-height:44px;font:var(--type-label);font-weight:var(--weight-semibold);color:var(--color-ink);white-space:nowrap}
.navpill.solo{padding:0 var(--space-4);gap:var(--space-2);font:var(--type-body-strong)}
.navpill button{width:34px;height:34px;border-radius:var(--radius-round);border:0;background:transparent;display:grid;place-items:center;color:var(--color-ink)}
.navpill button:disabled{opacity:.3;cursor:default}
.stage{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding-block:var(--space-2) var(--space-1)}
.mascotbtn{border:0;background:transparent;padding:0;cursor:pointer;border-radius:var(--radius-round)}
.mascot-big{width:200px;height:200px;display:block;animation:bob 3.4s ease-in-out infinite}
.mascot-big .tail{transform-origin:138px 158px;animation:wag .5s ease-in-out infinite alternate}
.mood{font:var(--type-h3);text-align:center}
.sum{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:var(--space-3);margin-top:var(--space-5)}
.sum .btn{padding:0 var(--space-4)}
.sum-card{background:var(--color-surface);border:var(--stroke-hair) solid var(--color-line);border-radius:var(--radius-lg);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-px);min-width:0}
.sum-label{gap:var(--space-2);color:var(--color-ink-2);font:var(--type-label);font-weight:var(--weight-semibold)}
.sum-big{font:var(--type-display);letter-spacing:var(--tracking-display);margin-top:var(--space-1);font-variant-numeric:tabular-nums}
.heat-day{font:var(--type-h2);margin-top:var(--space-1)}
.heat-tip{align-items:flex-start;gap:var(--space-2);font:var(--type-label);color:var(--color-ink-2)}
.heat-tip .ico-s{flex:none;margin-top:var(--space-px);color:var(--color-ink-3)}
.sum-big span{font-size:var(--text-h2);color:var(--color-ink-2);letter-spacing:0}
.bar.big{height:8px;margin-top:var(--space-4);background:var(--color-surface-2)}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:var(--space-3);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--space-1) var(--space-px) var(--space-2);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.ins{scroll-snap-align:start;border:0;border-radius:var(--radius-lg);padding:var(--space-5);display:flex;align-items:center;gap:var(--space-2);min-height:160px;text-align:left;color:var(--color-ink);position:relative;overflow:hidden;background:var(--color-surface-2)}
.ins-mint,.ins-blush,.ins-lav{background:var(--color-surface-2)}
.ins-sky{background:var(--color-feature);color:var(--color-on-feature)}
.ins-sky .ins-big{color:var(--color-feature-title)}
.ins-t{font:var(--type-title)}
.ins-big{font:var(--type-h1);letter-spacing:var(--tracking-tight)}
.ins-x{font:var(--type-body);margin-top:var(--space-px)}
.ins-art{width:108px;height:108px;flex-shrink:0;position:relative}
.ins-art svg{width:100%;height:100%;animation:bob 4s ease-in-out infinite}
.spark{position:absolute;width:8px;height:8px;background:var(--color-pink);transform:rotate(45deg);border-radius:2px;animation:twinkle 2.4s ease-in-out infinite}
.spark.s1{top:6px;left:2px}
.spark.s2{bottom:12px;right:0;background:var(--color-primary);animation-delay:1.1s}
.cdots{display:flex;justify-content:center;gap:var(--space-1)}
.cdots i{width:6px;height:6px;border-radius:var(--radius-pill);background:var(--color-line-strong);transition:width .3s,background .3s}
.cdots i.on{width:20px;background:var(--color-ink)}
.wk{background:var(--color-surface);border:var(--stroke-hair) solid var(--color-line);border-radius:var(--radius-lg);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4)}
.wk-big{font:var(--type-h1);letter-spacing:var(--tracking-tight);font-variant-numeric:tabular-nums}
.wk-big span{font:var(--type-title);color:var(--color-ink-2)}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--space-2)}
.bcol{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);font:var(--type-caption);font-weight:var(--weight-semibold);color:var(--color-ink-3)}
.btrack{width:100%;max-width:40px;height:120px;border-radius:var(--radius-sm);background:var(--color-surface-2);display:flex;align-items:flex-end;overflow:hidden}
.btrack i{display:block;width:100%;border-radius:var(--radius-sm);transition:height .7s cubic-bezier(.2,.8,.2,1)}
.btrack i.good,.lg.good{background:var(--color-primary)}
.btrack i.part,.lg.part{background:var(--pink-200)}
.bcol.today{color:var(--color-ink)}
.lg{width:10px;height:10px;border-radius:3px;display:inline-block}
@keyframes wag{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:rotate(45deg) scale(.7)}50%{opacity:1;transform:rotate(45deg) scale(1.1)}}

.enter{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.wiggle{animation:wiggle .6s ease}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes popin{0%{transform:scale(.6);opacity:.001}100%{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%{transform:translate(-50%,0) scale(.8);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,6px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:360px){ .quick{grid-template-columns:repeat(2,minmax(0,1fr))} .badges{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* ---------- Kudi components: shapes taken from the pet-care world ---------- */

/* pet ID tag: the pet's name chip, with a ring hole like a collar tag */
.navpill.solo{padding-left:var(--space-3)}

/* stamp card: a week of feeding, one inked stamp per day (all meals / some / none) */
.bars{gap:var(--space-1)}
.stamp-day{--tilt:0deg;width:100%;max-width:40px;aspect-ratio:1;border-radius:var(--radius-round);display:grid;place-items:center;transform:rotate(var(--tilt,0deg));border:var(--stroke-ui) dashed var(--color-line-strong);color:var(--color-on-primary)}
.stamp-day .ico-s{width:var(--icon-md);height:var(--icon-md);stroke-width:2}
.stamp-day.good{background:var(--color-primary);border:2px solid var(--lime-400)}
.stamp-day.part{background:var(--color-pink-soft);border:2px solid var(--color-pink);color:var(--color-ink)}
.stamp-day.part b,.stamp-day.now b{font:var(--type-micro)}
/* today is still going: an outline with the count so far, not "missed" */
.stamp-day.now{border:2px solid var(--color-ink);color:var(--color-ink);background:transparent}
.bcol.today{font-weight:var(--weight-bold)}
.stamp-day.future{border-style:solid;border-color:var(--color-line)}
.lg{border-radius:var(--radius-round)}

/* dose track: one capsule per dose of a medicine course */
.doses{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.doses i{width:18px;height:8px;border-radius:var(--radius-pill);background:var(--color-surface-3)}
.doses i.on{background:var(--color-primary)}
.doses i.next{background:transparent;box-shadow:inset 0 0 0 1.5px var(--color-pink-strong)}

/* travel ticket: notched sides and a perforated tear line */
.card.ticket{padding-top:0;overflow:hidden}
.trip-art-name{font-family:var(--font-sans);font-weight:var(--weight-bold);letter-spacing:.04em;fill:var(--art-cream)}
.ticket .route{font:var(--type-h3)}
/* life-stage timeline (Age guide): stops on a line, the pet's stage marked Now */
.stage-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-2)}

  const cfg = SOLID[n]; if (!cfg || !P[n]) return ic(n, cls);
  const paths = (P[n].match(/<path[^>]*\/>/g) || []);
  const body = paths.map((d,i) => cfg.fill.includes(i) ? d.replace('<path','<path fill="currentColor"') : (cfg.cut||[]).includes(i) ? '' : d).join('');
  if (!cfg.cut) return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  const id = 'solid' + (++SID);
  const holes = cfg.cut.map(i => paths[i].replace(/stroke="currentColor"/g,'stroke="#000"').replace('<path','<path fill="#000" stroke-width="1.75"')).join('');
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff" stroke="none"/>${holes}</mask><g mask="url(#${id})">${body}</g></svg>`;
}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => keyOf(new Date());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const addMonths = (k, n) => { const d = parseKey(k); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return keyOf(d); };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = k => { if(!k) return ''; const d = parseKey(k); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtS = k => { if(!k) return ''; const d = parseKey(k); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hmToMin = t => { const [h,m] = (t||'0:0').split(':').map(Number); return h*60+m; };
const monthsOld = b => { if(!b) return null; const a = parseKey(b), n = new Date(); let m = (n.getFullYear()-a.getFullYear())*12 + (n.getMonth()-a.getMonth()); if (n.getDate() < a.getDate()) m--; return Math.max(0,m); };
const ageLabel = m => m == null ? '' : m < 1 ? 'under 1 month' : m < 12 ? `${m} month${m===1?'':'s'}` : `${Math.floor(m/12)} yr${Math.floor(m/12)>1?'s':''}${m%12?` ${m%12} mo`:''}`;

async function initAuth(){

      if (cap.Browser) cap.Browser.close().catch(()=>{});
    });

    const { data: { session }, error } = await sbClient.auth.getSession();

function streak(s){

  const dayDone = d => s.meals.every(m => mealFed(s, m.id, d));
  let d = today(), n = 0;

  while (dayDone(d) && n < 400){ n++; d = addDays(d,-1); }
  return n;
}
function medActive(m, d){ return m.start <= d && d <= addDays(m.start, Math.max(1,m.days)-1); }
function medProgress(s, m){ const total = (m.times||[]).length * Math.max(1, m.days||1); const given = s.log.filter(l=>l.type==='med' && l.ref===m.id).length; return {total, given:Math.min(given,total)}; }

function vacStatus(v){
  if (!v.due) return {k:'ok', label:'No repeat'};
  const d = diffDays(today(), v.due);
  if (d < 0) return {k:'over', label:`Overdue ${-d} day${d===-1?'':'s'}`};
  if (d <= 30) return {k:'soon', label: d===0 ? 'Due today' : `Due in ${d} day${d===1?'':'s'}`};
  return {k:'ok', label:`Valid until ${fmt(v.due)}`};
}
function todayTasks(){
  const t = today();
  const meals = S.meals.map(m => ({done: !!mealFed(S,m.id,t)}));
  const doses = [];
  S.meds.filter(m=>medActive(m,t)).forEach(m => (m.times||[]).forEach(time => doses.push({done: !!doseLog(S,m,time,t)})));
  const all = meals.concat(doses);
  const done = all.filter(x=>x.done).length;
  return {done, total: all.length, pct: all.length ? done/all.length : 1};
}

function weeklyBlock(){

  const past = days.filter(d=>!d.future);

  const range = m1.getMonth() === m2.getMonth() ? `${MONTHS[m1.getMonth()]} ${m1.getDate()} to ${m2.getDate()}` : `${fmtS(monday)} to ${fmtS(end)}`;
  const names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

        return `<div class="bcol ${d.isToday?'today':''}" title="${names[i]}: ${d.future?'not yet':`${d.fed} of ${d.total} meals`}"><span class="stamp-day ${cls || (d.future?'future':'')}" style="--tilt:${[-6,4,-3,7,-5,3,-4][i]}deg">${cls==='good'?ic('check','ico-s'):(cls==='part'||cls==='now')?`<b class="num">${d.fed}/${d.total}</b>`:''}</span><span>${names[i]}</span></div>`; }).join('')}

}

      <div class="grow"><h1 class="greet">Hey, ${esc(pet)}</h1>${MVP && S.pet.birthday ? `<button class="age-line" data-a="openGuide" aria-label="${esc(ageLong(S.pet.birthday))}. See what ${esc(pet)} needs at this age">${esc(ageLong(S.pet.birthday))}${ic('right','ico-s')}</button>` : ''}</div>

function viewHealth(){

const EVENT_TYPES = [['groomer','Groomer','scissors'],['vet','Vet visit','steth'],['walk','Walk','walk'],['bath','Bath','bath'],['other','Other','cal']];
const eventType = k => EVENT_TYPES.find(x => x[0] === k) || EVENT_TYPES[EVENT_TYPES.length-1];
const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function dayLabel(k){ const t = today(); if (k === t) return 'Today'; if (k === addDays(t, 1)) return 'Tomorrow'; if (k === addDays(t, -1)) return 'Yesterday'; const d = parseKey(k); return `${WEEKDAYS[(d.getDay()+6)%7]} ${fmtS(k)}`; }
// everything on one day, in time order; all-day things (trips, vaccines) first
function calItems(day){
  const t = today(), now = hmToMin(nowHM()), items = [];
  const place = tr => tr.place || DESTS[tr.dest].label;
  S.trips.forEach(tr => {
    if (tr.date === day) items.push({time:'', icon:'plane', title:`Fly to ${place(tr)}`, sub:`${tripStats(tr).done} of ${tripStats(tr).total} steps ready`, a:`data-a="openTrip" data-id="${tr.id}"`});

  });
  S.vaccines.filter(v => v.due === day).forEach(v => items.push({time:'', icon:'syringe', title:`${v.name} vaccine due`, sub:'Book the vet', a:'data-a="go" data-tab="health" data-seg="vaccines"'}));
  (S.events||[]).filter(e => e.date === day).forEach(e => { const [, label, icn] = eventType(e.type); items.push({time:e.time||'', icon:icn, title: e.type === 'other' ? (e.note || 'Other') : label, sub: e.type === 'other' ? '' : e.note, a:`data-a="sheet" data-type="event" data-id="${e.id}"`, ev:true}); });
  S.meals.forEach(m => { const f = day <= t ? mealFed(S, m.id, day) : null; const late = !f && (day < t || (day === t && hmToMin(m.time) + 30 < now));
    items.push({time:m.time, icon:'bowl', title:m.name, sub: f ? `Fed by ${nameOf(f.by)} at ${f.time}` : late ? (day < t ? 'Not logged' : 'Late') : [m.food, m.portion].filter(Boolean).join(' · '), late: late && day === t, done:!!f, feed: day === t && !f ? m.id : null, a:`data-a="sheet" data-type="meal" data-id="${m.id}"`}); });

    items.push({time, icon:'pill', title:`${m.name} ${m.dose||''}`.trim(), sub: l ? `Given by ${nameOf(l.by)} at ${l.time}` : late ? 'Late' : 'Dose', late, done:!!l, give: day === t && !l ? {id:m.id, time} : null, a:'data-a="go" data-tab="health" data-seg="meds"'}); }));
  return items.sort((x, y) => (x.time ? hmToMin(x.time) : -1) - (y.time ? hmToMin(y.time) : -1));

  if (!subscribed) return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pmTitle" style="padding-bottom:calc(var(--space-8) + env(safe-area-inset-bottom,0px))">
    <div class="grab"></div>
    <div style="text-align:center;padding:var(--space-3) 0 var(--space-4)">
      <div class="pm-hero" aria-hidden="true"></div>
      <h2 id="pmTitle">Pawmates</h2>
      <p class="muted" style="margin:var(--space-2) 0 0">Find playmates and mates for ${esc(S.pet.name)} nearby. Swipe, match and chat, all in one place.</p>
    </div>
    <div style="background:var(--tint);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-4);margin-bottom:var(--space-4)">
      <div class="eyebrow" style="margin-bottom:var(--space-2)">Included in Family Plan</div>
      <div style="display:flex;flex-direction:column;gap:var(--space-2)">
        ${['Swipe profiles of dogs &amp; cats nearby','Match and start a conversation','Live family sync across all phones','Unlimited family members'].map(f=>`<div style="display:flex;align-items:center;gap:var(--space-2);font:var(--type-body)">${ic('check','ico-s')}<span>${f}</span></div>`).join('')}
      </div>
    </div>
    <button class="btn ink xl block" data-a="subscribePawmates">Unlock Pawmates · $3.99/mo</button>
    <button class="btn ghost block" style="margin-top:var(--space-2)" data-a="close">Maybe later</button>
  </div>`;

  const ms = loadPawmates();
  const matched = ms.matched.length;

  // Matches list view
  if (ui.sheet && ui.sheet.showMatches){
    const matchedProfiles = PAWMATES.filter(x=>ms.matched.includes(x.id));
    return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pmTitle" style="padding-bottom:calc(var(--space-8) + env(safe-area-inset-bottom,0px))">
      <div class="grab"></div>
      
      ${matchedProfiles.length?`<div>${matchedProfiles.map(mp=>{ const msgs=(ms.chats||{})[mp.id]||[]; const last=msgs[msgs.length-1]; const unread=!(ms.seen||[]).includes(mp.id)||msgs.length>((ms.read||{})[mp.id]||0); return `<button class="match-row" data-a="chatOpen" data-pid="${mp.id}" style="width:100%;text-align:left;border:0;background:transparent">
        <div class="av" style="background:${mp.color}">${mascot(mp.species,'happy')}</div>
        <div class="grow"><div class="t" style="${unread?'font-weight:var(--weight-bold)':''}">${esc(mp.name)} · ${esc(mp.breed)}</div><div class="s">${last?esc(last.text.slice(0,44)+(last.text.length>44?'…':'')):'Tap to say hi'}</div></div>
        ${unread?'<span class="unread-dot" aria-label="New"></span>':''}${ic('right','ico-s')}</button>`; }).join('')}</div>`:`<p class="muted" style="text-align:center;margin:var(--space-6) 0">No matches yet. Keep swiping!</p>`}
    </div>`;
  }

  // Just-matched celebration screen
  if (ui.sheet && ui.sheet.justMatched) {
    const p = PAWMATES.find(x=>x.id===ui.sheet.justMatched);
    if (p) return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pmTitle" style="padding-bottom:calc(var(--space-8) + env(safe-area-inset-bottom,0px))">
      <div class="grab"></div>
      <div class="pm-match">
        <div class="pm-match-avs">
          <div class="pm-match-av" style="background:${p.color}">${mascot(p.species,'happy')}</div>
          <div class="pm-match-heart">${ic('heart','ico-s')}</div>
          <div class="pm-match-av" style="background:var(--sun)">${petAvatar()}</div>
        </div>
        <h2 id="pmTitle" style="font-size:var(--text-h1);margin-bottom:var(--space-2)">It's a match!</h2>
        <p class="muted" style="margin:0 0 var(--space-2)">${esc(p.name)} liked ${esc(S.pet.name)} back!</p>
        <span class="pill sun" style="margin-bottom:var(--space-4)">${matched} match${matched>1?'es':''} total</span>
        <div class="card" style="text-align:left;gap:var(--space-4)">
          <div class="pm-match-av" style="width:52px;height:52px;flex-shrink:0;background:${p.color}">${mascot(p.species,'happy')}</div>
          <div><div class="t">${esc(p.name)}, ${p.age} yr${p.age>1?'s':''} · ${esc(p.breed)}</div><div class="s">${esc(p.bio)}</div></div>
        </div>
      </div>
      <button class="btn ink xl block" style="margin-top:var(--space-4)" data-a="chatOpen" data-pid="${p.id}">Send a woof!</button>
      <button class="btn ghost block" style="margin-top:var(--space-2)" data-a="pawmatesContinue">Keep swiping</button>
    </div>`;
  }

  const p = nextPawmate(ms);
  if (!p){
    const matchedProfiles = PAWMATES.filter(x=>ms.matched.includes(x.id));
    return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pmTitle" style="padding-bottom:calc(var(--space-8) + env(safe-area-inset-bottom,0px))">
    <div class="grab"></div>
    <div style="text-align:center;padding:var(--space-5) 0 var(--space-3)">
      <div class="pm-hero" aria-hidden="true"></div>
      <h2 id="pmTitle">No more pets nearby</h2>
      <p class="muted" style="margin:0 0 var(--space-1)">You've seen everyone. New pets join every week.</p>
    </div>
    ${matchedProfiles.length?`<div class="sec-h" style="margin-top:var(--space-2)"><h3>Your matches</h3><span class="pill sun">${ic('heart','ico-s')}${matchedProfiles.length}</span></div>
    <div>${matchedProfiles.map(mp=>{ const msgs = (ms.chats||{})[mp.id]||[]; const last = msgs[msgs.length-1]; return `<button class="match-row" data-a="chatOpen" data-pid="${mp.id}" style="width:100%;text-align:left;border:0;background:transparent">
      <div class="av" style="background:${mp.color}">${mascot(mp.species,'happy')}</div>
      <div class="grow"><div class="t">${esc(mp.name)} · ${esc(mp.breed)}</div><div class="s">${last?esc(last.text.slice(0,40)+(last.text.length>40?'…':'')):'Tap to say hi'}</div></div>
      ${ic('right','ico-s')}</button>`; }).join('')}</div>`:''}
    <button class="btn ghost block" data-a="pawmatesReset" style="margin-top:var(--space-3)">Start over</button>
    <button class="btn ink block" style="margin-top:var(--space-2)" data-a="close">Close</button>
  </div>`;
  }

  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pmTitle" style="padding-bottom:calc(var(--space-6) + env(safe-area-inset-bottom,0px))">
    <div class="grab"></div>
    <div class="pm-card" id="pmCard">
      <div class="pm-photo" style="background:${p.color}">${mascot(p.species,'happy','pm-mascot')}
        <div style="position:absolute;bottom:var(--space-3);left:var(--space-3);display:flex;gap:var(--space-2);flex-wrap:wrap">${p.tags.map(tag=>`<span class="pm-tag">${esc(tag)}</span>`).join('')}</div>
      </div>
      <div class="pm-info">
        <div class="pm-name">${esc(p.name)}, ${p.age} yr${p.age>1?'s':''} <span class="pm-g">${p.gender==='f'?ic('female','ico-s'):ic('male','ico-s')}</span></div>
        <div class="s" style="margin-top:var(--space-px)">${esc(p.breed)} · Tbilisi</div>
        <p style="margin:var(--space-2) 0 0;font-size:var(--text-body);color:var(--muted)">${esc(p.bio)}</p>
      </div>
    </div>
    <div class="pm-btns">
      <button class="pm-pass" data-a="pawmatePass" data-pid="${p.id}" aria-label="Pass">${ic('x')}</button>
      <button class="pm-like" data-a="pawmateLike" data-pid="${p.id}" aria-label="Like">${ic('heart')}</button>
    </div>
    <p class="small muted" style="text-align:center;margin:var(--space-2) 0 0">${(()=>{ const n = PAWMATES.length - ms.liked.length - ms.passed.length - 1; return n > 0 ? `${n} more pet${n>1?'s':''} nearby after this one` : 'Last pet nearby for now'; })()}</p>
  </div>`;
}

    <div class="grab"></div>

      <div class="price"><sup>$</sup>3.99<sub>/mo</sub></div>
      <div style="margin-top:var(--space-2);font-size:var(--text-body);color:var(--color-feature-ink-2)">${T('sub_plan_s')}</div>
    </div>

      <li>${ic('cloud','ico-s')}<span>${T('sub_f1')}</span></li>

/* ---------- care report sheet ---------- */
function careReportSheet(){
  const cs = careStats(), champ = allBadgesEarned(), L = levelOf(S.xp);
  const earned = BADGES.filter(b=>S.badges[b.id]).length;
  const row = (label, val, unit='') => `<div class="report-stat"><span class="lbl">${label}</span><span class="val">${val}<span style="font-size:var(--text-label);font-weight:var(--weight-bold);color:var(--color-ink-2)"> ${unit}</span></span></div>`;
  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" style="padding-bottom:calc(var(--space-8) + env(safe-area-inset-bottom,0px))">
    <div class="grab"></div>
    <div style="text-align:center;margin-bottom:var(--space-4)">
      <div class="rep-av" style="width:80px;height:80px;border-radius:50%;background:${champ?'var(--yellow-300)':'var(--color-surface-3)'};margin:0 auto var(--space-3);display:grid;place-items:center;overflow:hidden">${petAvatar()}</div>
      <h2 id="shTitle" style="margin-bottom:var(--space-px)">${esc(S.pet.name)} · ${T('rep_title')}</h2>
      <span class="pill ${champ?'sun':'ink'}">${champ?`Champion · ${T('me_badges')}`:`${T('me_level')} ${L.i+1} · ${T('lv'+L.i)}`}</span>
    </div>
    <div class="card col" style="gap:0;padding:0 var(--space-4)">
      ${cs.days ? row(T('rep_days'), cs.days, 'days') : ''}
      ${row(T('rep_meals'), cs.meals)}
      ${row(T('rep_streak'), streak(S), 'days')}
      ${cs.topFeeder ? row(T('rep_top'), esc(cs.topFeeder)) : ''}
      ${cs.meds ? row(T('rep_meds'), cs.meds) : ''}
      ${cs.vaccines ? row(T('rep_vac'), cs.vaccines) : ''}
      ${cs.treats ? row(T('rep_treats'), cs.treats) : ''}
      ${cs.walks ? row(T('rep_walks'), cs.walks) : ''}
      ${cs.water ? row(T('rep_water'), cs.water) : ''}
      ${cs.tripsComplete ? row(T('rep_trips'), cs.tripsComplete) : ''}
      ${row(T('rep_xp'), S.xp, 'XP')}
      ${row(T('rep_badges'), `${earned} / ${BADGES.length}`)}
    </div>
    ${champ ? `<p class="small muted" style="text-align:center;margin:var(--space-3) 0 0">${T('rep_champ',esc(S.pet.name))}</p>` : ''}
    <button class="btn ghost block" style="margin-top:var(--space-2)" data-a="close">${T('act_close')}</button>
  </div>`;
}

/* ---------- sheets ---------- */
function sheetHTML(){
  const sh = ui.sheet; if (!sh) return '';
  if (MVP && ui.tab === 'pawmates' && (sh.type === 'pawmates' || sh.type === 'chat')) return ''; // drawn in the tab itself
  if (sh.type === 'subscribe') return subscribeSheet();
  if (sh.type === 'pawmates') return pawmatesSheet();
  if (sh.type === 'chat') return takeover(chatSheet(), null);
  if (sh.type === 'report') return careReportSheet();
  if (sh.type === 'whoami') return `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"><div class="grab"></div>
    <h2 id="shTitle">${T('whoami_t')}</h2><p class="muted" style="margin:0 0 var(--space-4)">Your name shows next to everything you log for ${esc(S.pet.name)}.</p>
    <div class="stack">${S.members.map(m=>`<button class="card" data-a="iam" data-id="${m.id}" style="text-align:left;width:100%"><span class="badge-ico sun" style="border-radius:50%;font-weight:var(--weight-bold)">${esc(m.name.slice(0,1).toUpperCase())}</span><div class="grow t">I'm ${esc(m.name)}</div>${ic('right','ico-s')}</button>`).join('')}
    <form class="row" data-form="joinme"><input class="in grow" id="joinName" name="name" maxlength="24" placeholder="${T('whoami_new')}" aria-label="Your name"><button class="btn ink" type="submit">${T('act_join')}</button></form></div></div>`;
  let title = '', body = '';
  const f = (id, label, input) => `<div class="field"><label for="${id}">${label}</label>${input}</div>`;
  if (sh.type === 'meal'){
    const m = S.meals.find(x=>x.id===sh.id) || {name:'',time:'12:00',food:'',portion:''};
    title = sh.id ? 'Edit meal' : 'New meal time';
    body = `${f('fMealName','Meal',`<input class="in" id="fMealName" name="name" required maxlength="24" value="${esc(m.name)}" placeholder="Lunch">`)}
      ${f('fMealTime','Time',`<input class="in" id="fMealTime" name="time" type="time" required value="${esc(m.time)}">`)}
      ${f('fMealFood','Food',`<input class="in" id="fMealFood" name="food" maxlength="50" value="${esc(m.food)}" placeholder="e.g. Puppy kibble" list="dlFoods">`)}
      <datalist id="dlFoods">${S.items.filter(i=>i.kind==='food').map(i=>`<option value="${esc(i.name)}"></option>`).join('')}</datalist>
      ${f('fMealPortion','Portion',`<input class="in" id="fMealPortion" name="portion" maxlength="30" value="${esc(m.portion)}" placeholder="e.g. 120 g">`)}`;
  } else if (sh.type === 'med'){
    const m = S.meds.find(x=>x.id===sh.id) || {name:'',dose:'',times:['08:00','20:00'],start:today(),days:7,vet:'',notes:''};
    const tm = [0,1,2].map(i => m.times[i] || '');
    title = sh.id ? 'Edit prescription' : 'Add a prescription';
    body = `${f('fMedName','Medicine',`<input class="in" id="fMedName" name="name" required maxlength="40" value="${esc(m.name)}" placeholder="e.g. Amoxicillin">`)}
      <div class="two">${f('fMedDose','Dose',`<input class="in" id="fMedDose" name="dose" maxlength="30" value="${esc(m.dose)}" placeholder="250 mg">`)}${f('fMedDays','Days',`<input class="in" id="fMedDays" name="days" type="number" min="1" max="365" required value="${esc(m.days)}">`)}</div>
      <div class="field"><span class="lbl">Times a day (leave blank to skip)</span><div class="three">${tm.map((v,i)=>`<input class="in" name="t${i}" type="time" value="${esc(v)}" aria-label="Dose time ${i+1}">`).join('')}</div></div>
      ${f('fMedStart','First day',`<input class="in" id="fMedStart" name="start" type="date" required value="${esc(m.start)}">`)}
      ${f('fMedVet','Prescribed by',`<input class="in" id="fMedVet" name="vet" maxlength="60" value="${esc(m.vet)}" placeholder="Dr. name, clinic">`)}
      ${f('fMedNotes','Notes',`<input class="in" id="fMedNotes" name="notes" maxlength="80" value="${esc(m.notes)}" placeholder="With food">`)}`;
  } else if (sh.type === 'vac'){
    const v = S.vaccines.find(x=>x.id===sh.id) || {name:'',given:today(),repeat:12,due:addMonths(today(),12),notes:''};
    title = sh.id ? 'Edit vaccine' : 'Add a vaccine';
    body = `${f('fVacName','Vaccine',`<input class="in" id="fVacName" name="name" required maxlength="40" value="${esc(v.name)}" list="dlVac" placeholder="Rabies">`)}
      <datalist id="dlVac">${VACCINES.map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>
      <div class="two">${f('fVacGiven','Date given',`<input class="in" id="fVacGiven" name="given" type="date" max="${today()}" value="${esc(v.given)}">`)}
      ${f('fVacRepeat','Repeats',`<select class="in" id="fVacRepeat" name="repeat">${[[1,'In 1 month'],[3,'In 3 months'],[6,'In 6 months'],[12,'Every year'],[36,'Every 3 years'],[0,'No repeat']].map(([n,l])=>`<option value="${n}" ${+v.repeat===n?'selected':''}>${l}</option>`).join('')}</select>`)}</div>
      ${f('fVacNotes','Notes',`<input class="in" id="fVacNotes" name="notes" maxlength="60" value="${esc(v.notes)}" placeholder="Batch number, clinic">`)}
      <p class="small muted" style="margin:0">Kudi works out the next due date and reminds the family a month ahead.</p>`;
  } else if (sh.type === 'item'){
    const it = S.items.find(x=>x.id===sh.id) || {kind: sh.kind||'food', name:'', note:''};
    title = sh.id ? 'Edit item' : 'Add to pantry';
    body = `<div class="choice">${[['food','Food','bowl'],['treat','Treat','bone'],['toy','Toy','ball']].map(([k,l,i])=>`<label class="opt"><input type="radio" name="kind" value="${k}" ${it.kind===k?'checked':''}><span>${ic(i)}${l}</span></label>`).join('')}</div>
      ${f('fItemName','Name',`<input class="in" id="fItemName" name="name" required maxlength="50" value="${esc(it.name)}" placeholder="e.g. Salmon training bites">`)}
      ${f('fItemNote','Note',`<input class="in" id="fItemNote" name="note" maxlength="80" value="${esc(it.note)}" placeholder="Where to buy, how much they like it">`)}`;
  } else if (sh.type === 'trip'){
    title = 'Plan a trip';
    body = `${f('fTripDest','Going to',`<select class="in" id="fTripDest" name="dest">${Object.entries(DESTS).map(([k,d])=>`<option value="${k}">${esc(d.label)}</option>`).join('')}</select>`)}
      ${f('fTripPlace','City or country (optional)',`<input class="in" id="fTripPlace" name="place" maxlength="30" placeholder="e.g. Germany">`)}
      ${f('fTripDate','Flight date',`<input class="in" id="fTripDate" name="date" type="date" required min="${today()}" value="${addMonths(today(),5)}">`)}
      <p class="small muted" style="margin:0">From Georgia, the EU and UK need a rabies blood test at least 3 months before arrival.</p>`;

      ${f('fStepDue','Do by (optional)',`<input class="in" id="fStepDue" name="due" type="date">`)}`;
  } else if (sh.type === 'event'){
    const e = (S.events||[]).find(x=>x.id===sh.id) || {type:'groomer', date: sh.date || ui.calDay || today(), time:'', note:''};
    title = sh.id ? 'Edit event' : 'Add to calendar';
    body = `<div class="choice">${EVENT_TYPES.map(([k,l,i])=>`<label class="opt"><input type="radio" name="type" value="${k}" ${e.type===k?'checked':''}><span>${ic(i)}${l}</span></label>`).join('')}</div>
      <div class="two">${f('fEvDate','Date',`<input class="in" id="fEvDate" name="date" type="date" required value="${esc(e.date)}">`)}${f('fEvTime','Time (optional)',`<input class="in" id="fEvTime" name="time" type="time" value="${esc(e.time)}">`)}</div>

      ${sh.id ? '' : `<p class="small muted" style="margin:0">Flying somewhere? <button type="button" class="link" data-a="sheet" data-type="trip">Plan a trip</button> and Kudi builds the checklist.</p>`}`;
  } else if (sh.type === 'weight'){
    const last = sh.id ? S.log.find(l=>l.id===sh.id) : S.log.filter(l=>l.type==='weight').sort((a,b)=>b.at-a.at)[0];
    title = sh.id ? 'Edit weight' : `Weigh ${S.pet.name}`;
    body = `${f('fWeight','Weight in kg',`<input class="in" id="fWeight" name="kg" type="number" step="0.1" min="0.1" max="120" required value="${last?esc(last.value):''}" inputmode="decimal" placeholder="12.4">`)}`;
  } else if (sh.type === 'pet'){
    const p = S.pet;
    title = 'Edit pet';
    body = `${photoPicker(sh.photo !== undefined ? sh.photo : p.photo, 'pet')}
      ${f('fPetName','Name',`<input class="in" id="fPetName" name="name" required maxlength="30" value="${esc(p.name)}">`)}
      ${f('fPetSpecies','Species',`<select class="in" id="fPetSpecies" name="species">${[['dog','Dog'],['cat','Cat'],['other','Other']].map(([k,l])=>`<option value="${k}" ${p.species===k?'selected':''}>${l}</option>`).join('')}</select>`)}
      <div class="two">${f('fPetBday','Birthday',`<input class="in" id="fPetBday" name="birthday" type="date" max="${today()}" value="${esc(p.birthday)}">`)}${f('fPetBreed','Breed',`<input class="in" id="fPetBreed" name="breed" maxlength="40" value="${esc(p.breed)}">`)}</div>
      <div class="two">${f2('fPetSex','Girl or boy',`<select class="in" id="fPetSex" name="sex">${[['','Not sure'],['female','Girl'],['male','Boy']].map(([k,l])=>`<option value="${k}" ${p.sex===k?'selected':''}>${l}</option>`).join('')}</select>`)}${f2('fPetSpay','Spayed / neutered',`<select class="in" id="fPetSpay" name="spayed">${[['','Not sure'],['no','No'],['yes','Yes']].map(([k,l])=>`<option value="${k}" ${p.spayed===k?'selected':''}>${l}</option>`).join('')}</select>`)}</div>`;
  } else if (sh.type === 'heat'){
    const h = S.heats.find(x=>x.id===sh.id) || {start:today(), end:'', notes:''};

/* ---------- page transitions ----------
   fwd: new page slides in from the right, old one slides left and fades; back: the exact mirror; tab: cross-fade */
const PAGE_EASE = 'cubic-bezier(.4,0,.2,1)', PAGE_MS = 320;
// `r` is the old page's box, measured before the swap (a detached node has no size)
const TAB_OUT = 90, TAB_IN = 210;
function pageTransition(prev, r, next, dir){
  if (!prev || !r || !next || !dir || reduced()) return;
  const ghost = prev.cloneNode(true); ghost.classList.remove('enter'); ghost.classList.add('page-ghost'); ghost.setAttribute('aria-hidden','true'); ghost.removeAttribute('id');
  Object.assign(ghost.style, {left:r.left+'px', top:r.top+'px', width:r.width+'px', zIndex: dir==='back' ? 3 : 1});
  (next.parentElement || document.body).appendChild(ghost); document.body.classList.add('transitioning');
  const out = dir==='fwd' ? [{transform:'translateX(0)',opacity:1},{transform:'translateX(-24%)',opacity:0}]
           : dir==='back' ? [{transform:'translateX(0)',opacity:1},{transform:'translateX(24%)',opacity:0}]
           : [{opacity:1},{opacity:0}];
  const inn = dir==='fwd' ? [{transform:'translateX(24%)',opacity:0},{transform:'translateX(0)',opacity:1}]
           : dir==='back' ? [{transform:'translateX(-24%)',opacity:0},{transform:'translateX(0)',opacity:1}]
           : [{opacity:0},{opacity:1}];
  if (dir==='tab'){
    // fade through: the old page leaves first, then the new one arrives, so two pages never overlap
    ghost.animate(out, {duration:TAB_OUT, easing:'ease-in', fill:'forwards'}).onfinish = () => { ghost.remove(); document.body.classList.remove('transitioning'); };
    next.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}], {duration:TAB_IN, delay:TAB_OUT, easing:'cubic-bezier(0,0,.2,1)', fill:'backwards'});
    return;
  }
  ghost.animate(out, {duration:PAGE_MS, easing:PAGE_EASE, fill:'forwards'}).onfinish = () => { ghost.remove(); document.body.classList.remove('transitioning'); };
  next.animate(inn, {duration:PAGE_MS, easing:PAGE_EASE});
}

/* ---------- Live Activity (iOS Dynamic Island) ----------
   In the iOS app, the next meal or dose due within the hour shows on the Dynamic Island and Lock Screen
   with a countdown and the mascot. Nothing happens on the web. */
let liveKey = '';
function syncLiveActivity(){
  const LA = IS_NATIVE && window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LiveActivity;
  if (!LA || !S || ui.ob) return;
  const t = today(), now = hmToMin(nowHM());
  const due = [
    ...S.meals.filter(m => !mealFed(S, m.id, t)).map(m => ({time:m.time, title:`${m.name} for ${S.pet.name}`, sub:[m.food, m.portion].filter(Boolean).join(' · ') || 'Tap to mark as fed'})),
    ...S.meds.filter(m => medActive(m, t)).flatMap(m => (m.times||[]).filter(time => !doseLog(S, m, time, t)).map(time => ({time, title:`${m.name} for ${S.pet.name}`, sub:m.dose || 'Medicine'})))
  ].filter(x => hmToMin(x.time) - now <= 60 && now - hmToMin(x.time) <= 120).sort((a, b) => hmToMin(a.time) - hmToMin(b.time))[0];
  const key = due ? `${due.title}@${due.time}` : '';
  if (key === liveKey) return; liveKey = key;
  if (!due){ LA.end().catch(()=>{}); return; }
  const at = parseKey(t); const [h, mi] = due.time.split(':').map(Number); at.setHours(h, mi, 0, 0);
  LA.start({petName:S.pet.name, title:due.title, subtitle:due.sub, dueAt:at.getTime(), isLate: hmToMin(due.time) + 30 < now}).catch(()=>{});
}

  if (pg && hadPage){ pg.classList.add('stay'); const d = opts && opts.sheetDir; if (d && !reduced()) [...pg.children].forEach(c => c.animate(d==='back' ? [{opacity:0,transform:'translateX(-24%)'},{opacity:1,transform:'none'}] : [{opacity:0,transform:'translateX(24%)'},{opacity:1,transform:'none'}], {duration:PAGE_MS, easing:PAGE_EASE})); }
  modals.forEach(m => layer.appendChild(m));
  if (opts && opts.keepScroll) window.scrollTo(0, scrollKeep);

  ui.flash = null;

function photoPicker(src, where){
  return `<div class="photo-pick">
    <label class="photo-ring" for="petPhoto-${where}">${src ? `<img src="${src}" alt="">` : ic('camera')}<span class="sr">${src ? 'Change photo' : 'Add a photo'}</span></label>
    <input type="file" id="petPhoto-${where}" accept="image/*" data-photo="${where}" class="sr">

  </div>`;
}
function shrinkPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const n = 320, c = document.createElement('canvas'); c.width = c.height = n; const k = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, n, n); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('photo')); };
    img.src = url;
  });
}

/* ---------- heat cycle ---------- */
const HEAT = {dog:{interval:182, length:21, watch:60}, cat:{interval:21, length:7, watch:0}};
function heatTab(){ return S && S.pet.sex !== 'male' && S.pet.spayed !== 'yes' && (S.pet.species === 'dog' || S.pet.species === 'cat'); }
function showHeat(){ return heatTab() && S.pet.sex === 'female'; }
function heatInfo(){
  const t = today(), sp = S.pet.species === 'cat' ? 'cat' : 'dog', def = HEAT[sp];
  const hs = [...S.heats].sort((a,b)=>a.start.localeCompare(b.start));
  const last = hs[hs.length-1] || null;
  const gaps = [];
  for (let i=1;i<hs.length;i++){ const g = diffDays(hs[i-1].start, hs[i].start); if (sp === 'cat' ? g >= 7 && g <= 60 : g >= 90 && g <= 400) gaps.push(g); }
  const avg = gaps.length ? Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length) : def.interval;
  let cur = false, day = 0;
  if (last){ const d = diffDays(last.start, t); if (d >= 0 && (last.end ? last.end >= t : d < def.length)) { cur = true; day = d + 1; } }
  let next = null;
  if (last && !cur){ next = addDays(last.start, avg); if (sp === 'cat' && diffDays(last.start, t) > 60) next = null; while (next && next < t && sp === 'dog') next = addDays(next, avg); if (next && next < t) next = null; }
  let watchUntil = null;
  if (sp === 'dog' && last && !cur){ const endK = last.end || addDays(last.start, def.length-1); const until = addDays(endK, def.watch); if (until >= t) watchUntil = until; }
  return {sp, hs, last, cur, day, avg, next, watchUntil, learned: gaps.length};
}
function heatBody(){
  if (S.pet.sex !== 'female'){

      return `<div class="li ${ui.flash==='heat:'+h.id?'enter':''}"><span class="badge-ico" style="width:36px;height:36px;border-radius:var(--radius-md)">${ic('heart','ico-s')}</span>

  return `${status}
    ${H.cur ? '' : `<button class="btn ink block" data-a="sheet" data-type="heat">Log heat</button>`}

}
