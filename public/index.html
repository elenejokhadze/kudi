<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Shared pet care: feeding, medicine, vaccines, heat, travel and reminders for the whole family.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kudi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Kudi Pet Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: one phone-width app column, centred on wide screens; sticky header, fixed bottom tab bar, bottom sheets for every add/edit form.
   Colour: three hues only - pine ink, sunflower accent, paper - plus tints of the ink. */
:root{
  color-scheme:light;
  --paper:#FFFFFF;
  --card:#FFFFFF;
  --solid:#FFFFFF;
  --ink:#16171A;
  --muted:#656B75;
  --sun:#D6E4FB;
  --on-sun:#1D3E73;
  --on-ink:#FFFFFF;
  --line:rgba(22,23,26,.09);
  --tint:#F4F6FA;
  --tint2:#ECF0F7;
  --shadow:0 14px 34px rgba(46,72,128,.10);
  --sky-bg:#D5E3FA;
  --blue:#86A9EA;
  --mint:#DDF0D4; --mint-ink:#2F6B31;
  --blush:#F8DFDA; --blush-ink:#8C3B2D;
  --lav:#E8E5F9;
  --bar-good:#A9DEC4; --bar-part:#F2BBC8;
  --f-display:'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --f-body:'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
html,body{height:100%}
body{background:#FFFFFF;min-height:100%;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance;font-weight:700}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 120px;position:relative}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.ico{width:22px;height:22px;flex-shrink:0}
.ico-s{width:16px;height:16px;flex-shrink:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.top h1{font-size:28px;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;background:var(--tint2);color:var(--ink);white-space:nowrap}
.pill.sun{background:var(--sun);color:var(--on-sun)}
.pill.ink{background:var(--solid);color:var(--ink);border:1.5px solid var(--line)}
.pill.ghost{background:transparent;border:1.5px dashed var(--line)}

/* hero (today) */
.hero{background:var(--solid);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r-lg);padding:18px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:var(--sun);opacity:.12;right:-60px;top:-70px;opacity:.22}
.hero h2{font-size:26px}
.ring{position:relative;width:92px;height:92px;flex-shrink:0}
.ring svg.track{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .face{position:absolute;inset:9px;border-radius:50%;background:var(--sun);display:grid;place-items:center;overflow:hidden}
.ring .face svg{width:86%;height:86%}
.xpbar{height:10px;border-radius:999px;background:rgba(128,146,140,.32);overflow:hidden}
.xpbar > i{display:block;height:100%;border-radius:999px;background:var(--blue);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hero .pill{background:var(--tint2);color:var(--ink)}
.hero .pill.sun{background:var(--sun);color:var(--on-sun)}

/* sections + cards */
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h3{font-size:20px}
.link{border:0;background:none;color:var(--ink);font-weight:800;font-size:14px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:var(--sun)}
.card{background:var(--card);border-radius:22px;box-shadow:0 6px 20px rgba(46,72,128,.05);padding:14px;display:flex;align-items:center;gap:12px;border:1px solid var(--line)}
.card.col{flex-direction:column;align-items:stretch}
.badge-ico{width:44px;height:44px;border-radius:14px;background:var(--tint2);display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.badge-ico.sun{background:var(--sun);color:var(--on-sun)}
.badge-ico.ink{background:var(--solid);color:var(--ink);border:1.5px solid var(--line)}
.t{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* meal card */
.meal{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;transition:background .3s}
.meal.done{background:var(--mint)}
.meal .big{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15}
.btn{border:0;border-radius:999px;min-height:48px;padding:0 18px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease, background .2s}
.btn:active{transform:scale(.96)}
.btn.sun{background:var(--ink);color:var(--on-ink);box-shadow:0 10px 24px rgba(22,23,26,.18)}
.btn.sun:active{transform:scale(.97)}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 4px 14px rgba(46,72,128,.06)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn.xl{min-height:60px;font-size:17px}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--tint2);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.iconbtn.sm{width:36px;height:36px}
.done-line{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.check{width:24px;height:24px;border-radius:50%;background:var(--bar-good);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.check.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}

/* quick log */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qbtn{border:1px solid var(--line);background:var(--card);border-radius:22px;box-shadow:0 6px 18px rgba(46,72,128,.06);min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:13px;transition:transform .12s}
.qbtn:active{transform:scale(.94)}
.qbtn .ico{color:var(--ink)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);background:var(--tint2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;white-space:nowrap;padding:0 12px;min-height:40px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(46,72,128,.12)}

/* progress */
.bar{height:8px;border-radius:999px;background:var(--tint2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.sun > i{background:var(--blue)}

/* list rows */
.list{background:var(--card);border-radius:22px;box-shadow:0 6px 20px rgba(46,72,128,.05);border:1px solid var(--line);padding:2px 14px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.empty{border:2px dashed var(--line);border-radius:var(--r-md);padding:18px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* steps (travel) */
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex-shrink:0;color:var(--on-sun);transition:background .2s,border-color .2s}
.tick[aria-checked="true"]{background:var(--sun);border-color:var(--sun)}
.step.late .s b{color:var(--ink);background:var(--sun);padding:0 6px;border-radius:6px}

/* badges grid */
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;font-weight:800}
.bdg .medal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--tint2);color:var(--muted)}
.bdg.on .medal{background:var(--sun);color:var(--on-sun);box-shadow:inset 0 -4px 0 rgba(34,35,38,.18)}
.bdg:not(.on){color:var(--muted)}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:10;pointer-events:none}
.nav-in{pointer-events:auto;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px}
.nav button{border:0;background:transparent;border-radius:18px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);position:relative}
.nav button[aria-current="page"]{background:var(--sun);color:var(--on-sun)}
.nav .dot{position:absolute;top:8px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--sun);border:2px solid var(--card)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,15,17,.45);z-index:20;animation:fade .2s ease}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);max-height:88%;overflow:auto;background:var(--paper);border-radius:28px 28px 0 0;z-index:21;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.9,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:999px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:24px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:800;color:var(--muted)}
.in{min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;font-weight:600;width:100%}
textarea.in{padding:12px 14px;min-height:80px}
.in:focus{border-color:var(--ink);outline:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choice button{border:2px solid var(--line);background:var(--card);border-radius:18px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800}
.choice button[aria-pressed="true"]{border-color:var(--ink);background:var(--sun);color:var(--on-sun)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);padding:6px 6px 6px 14px;font-weight:800;font-size:14px}
.chip button{width:28px;height:28px;border-radius:50%;border:0;background:var(--tint2);display:grid;place-items:center}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:24px 32px}
.ob h1{font-size:34px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:999px;background:var(--tint2);transition:width .3s,background .3s}
.dots i.on{width:26px;background:var(--ink)}
.splash{background:#FFFFFF;border-radius:32px;height:250px;position:relative;overflow:hidden;display:grid;place-items:center}
.splash .sunball{position:absolute;width:210px;height:210px;border-radius:50%;background:var(--card);opacity:.7}
.splash svg.mascot{position:relative;width:190px;height:190px;animation:bob 3s ease-in-out infinite}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.feat div{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800;font-size:14px}
.sub-hero{background:linear-gradient(135deg,var(--sun) 0%,var(--tint2) 100%);border-radius:22px;padding:22px 18px;text-align:center;border:1px solid var(--line)}
.sub-hero .price{font-family:var(--f-display);font-weight:800;font-size:42px;letter-spacing:-.03em;line-height:1}
.sub-hero .price sup{font-size:22px;vertical-align:super;letter-spacing:0}
.sub-hero .price sub{font-size:16px;vertical-align:baseline;opacity:.65}
.sub-feats{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.sub-feats li{list-style:none;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.sub-badge{display:inline-flex;align-items:center;gap:5px;background:var(--mint);color:var(--mint-ink);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
/* champion state */
:root{--gold:#F6C94E;--gold-deep:#B8860B;--gold-bg:#FEF9E7}
.ring.champion .face{background:linear-gradient(135deg,#F6C94E 0%,#FFE08A 100%)}
.ring.champion svg.track circle:last-child{stroke:#F6C94E}
.ring.champion{filter:drop-shadow(0 0 10px rgba(246,201,78,.5))}
.bdg.champion-all{grid-column:1/-1;background:linear-gradient(135deg,var(--gold-bg),#fff);border:2px solid var(--gold);border-radius:18px;padding:14px 16px;flex-direction:row;gap:12px;text-align:left;font-size:14px}
.bdg.champion-all .medal{background:linear-gradient(135deg,#F6C94E,#FFE08A);color:var(--gold-deep);box-shadow:0 4px 16px rgba(246,201,78,.4);width:52px;height:52px;flex-shrink:0}
/* care report */
.report-stat{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.report-stat:last-child{border-bottom:none}
.report-stat .lbl{font-size:14px;font-weight:700;color:var(--muted)}
.report-stat .val{font-family:var(--f-display);font-weight:800;font-size:18px}
/* affiliate cards */
.aff-card{background:var(--tint);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px}
.aff-card .aff-tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.aff-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.aff-links a{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:800;text-decoration:none;background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.aff-links a:hover{background:var(--tint2)}

/* overlays: toast, xp float, confetti, badge modal */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px;z-index:40;display:flex;gap:10px;align-items:center;animation:toast 2.6s ease forwards;white-space:nowrap;max-width:calc(100% - 32px)}
.toast button{border:0;background:var(--sun);color:var(--on-sun);border-radius:999px;padding:4px 10px;font-weight:800}
.xpfloat{position:fixed;z-index:45;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--on-sun);background:var(--sun);padding:2px 10px;border-radius:999px;animation:float 1.1s ease-out forwards}
.bit{position:fixed;z-index:44;pointer-events:none;width:12px;height:12px}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(15,15,17,.55);animation:fade .2s}
.modal-in{background:var(--card);border-radius:30px;padding:26px 22px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:popin .5s cubic-bezier(.2,1.5,.4,1)}
.modal-in .medal{width:96px;height:96px;border-radius:50%;background:var(--sun);color:var(--on-sun);display:grid;place-items:center;box-shadow:inset 0 -6px 0 rgba(34,35,38,.18);animation:spin 1s ease}
.modal-in .medal svg{width:46px;height:46px}

/* reminder banner + switches */
#rem{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 78px);width:min(456px,calc(100% - 24px));z-index:30}
.rem{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;animation:drop .45s cubic-bezier(.2,1.3,.4,1)}
.rem .bellwrap{animation:ring 1.2s ease .3s 2}
.rem .acts{display:flex;gap:8px;flex-wrap:wrap}
.rem .acts .btn{flex:1;min-width:110px}
input.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:999px;background:var(--tint2);position:relative;flex-shrink:0;cursor:pointer;transition:background .2s;margin:0}
input.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
input.switch:checked{background:var(--sun)}
input.switch:checked::after{transform:translateX(20px)}
.calrow a.btn{text-decoration:none;white-space:nowrap}
@keyframes drop{from{transform:translateY(-120%);opacity:.001}to{transform:none;opacity:1}}
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(10deg)}40%{transform:rotate(-8deg)}50%{transform:rotate(4deg)}60%{transform:rotate(0)}}

/* today: stage, summary, insights, weekly */
.iconbtn{background:var(--card);border:1.5px solid var(--line);box-shadow:0 4px 14px rgba(46,72,128,.07)}
.navpill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px;min-height:44px;font-weight:700;font-size:14px;color:var(--ink);box-shadow:0 4px 14px rgba(46,72,128,.06);white-space:nowrap}
.navpill.solo{padding:0 16px;gap:8px;font-size:15px}
.navpill button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.navpill button:disabled{opacity:.3;cursor:default}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:6px 4px}
.mascotbtn{border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%}
.mascot-big{width:200px;height:200px;display:block;animation:bob 3.4s ease-in-out infinite}
.mascot-big .tail{transform-origin:138px 158px;animation:wag .5s ease-in-out infinite alternate}
.mood{font-family:var(--f-display);font-weight:700;font-size:20px;text-align:center;letter-spacing:-.01em}
.sum{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px;margin-top:18px}
.sum .btn{padding:0 14px}
.sum-card{background:var(--card);border:1.5px solid var(--line);border-radius:30px;padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.sum-label{gap:8px;color:var(--mint-ink);font-family:var(--f-display);font-weight:800;font-size:20px}
.sum-big{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1.05;letter-spacing:-.03em;margin-top:4px}
.sum-big span{font-size:26px;color:var(--muted);font-weight:700}

function blank(){ return {v:1, sample:false, pet:{name:'',species:'dog',birthday:'',breed:'',sex:'',spayed:''}, members:[], meals:[], log:[], meds:[], vaccines:[], items:[], trips:[], heats:[], xp:0, badges:{}, updatedAt:Date.now()}; }
function normalize(s){ const b = blank(); s = Object.assign(b, JSON.parse(JSON.stringify(s||{}))); s.pet = Object.assign({name:'',species:'dog',birthday:'',breed:'',sex:'',spayed:''}, s.pet||{}); ['members','meals','log','meds','vaccines','items','trips','heats'].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; }); if(!s.badges||typeof s.badges!=='object') s.badges={}; return s; }

function save(){
  if (!S) return;
  S.updatedAt = Date.now();
  // keep the log small: last 60 days
  const cut = addDays(today(), -60);
  S.log = S.log.filter(l => l.date >= cut);
  const json = JSON.stringify(S);
  lsSet(LS, json);
  if (remote){
    clearTimeout(pushTimer);
    pushTimer = setTimeout(()=>{ lastPushed = json; remote.push(JSON.parse(json)).catch(()=>{ toast(t('toast_cant')); }); }, 350);
  }
}
/* apply data that arrived from the shared store (artifact db or the Vercel API) */
function applyRemote(data, first){
  if (!data){ if (first && S) save(); return; }
  const r = normalize(data);
  if (first && S && (S.updatedAt||0) > (r.updatedAt||0)){ save(); return; }
  if (!first && S && (r.updatedAt||0) <= (S.updatedAt||0)) return;
  S = r; lsSet(LS, JSON.stringify(S));
  if (!S.members.find(m=>m.id===me)) me = null;
  if (ui.ob && S.members.length) ui.ob = null;
  if (!me && S.members.length && !ui.sheet) ui.sheet = {type:'whoami'};
  if (!ui.sheet || ui.sheet.type === 'whoami') render({keepScroll:true});
}
function meName(){ const m = S.members.find(x=>x.id===me) || S.members[0]; return m ? m.name : 'Someone'; }

/* ---------- derived ---------- */
function mealFed(s, mealId, date){ return s.log.find(l=>l.type==='meal' && l.ref===mealId && l.date===date); }
function streak(s){
  if (!s.meals.length) return 0;
  const dayDone = d => s.meals.every(m => mealFed(s, m.id, d));
  let d = today(), n = 0;
  if (!dayDone(d)) d = addDays(d,-1);
  while (dayDone(d) && n < 400){ n++; d = addDays(d,-1); }
  return n;
}
function medActive(m, d){ return m.start <= d && d <= addDays(m.start, Math.max(1,m.days)-1); }
function medProgress(s, m){ const total = (m.times||[]).length * Math.max(1, m.days||1); const given = s.log.filter(l=>l.type==='med' && l.ref===m.id).length; return {total, given:Math.min(given,total)}; }
function doseLog(s, m, time, date){ return s.log.find(l=>l.type==='med' && l.ref===m.id && l.value===time && l.date===date); }
function vacStatus(v){
  if (!v.due) return {k:'ok', label:'No repeat'};
  const d = diffDays(today(), v.due);
  if (d < 0) return {k:'over', label:`Overdue ${-d} day${d===-1?'':'s'}`};
  if (d <= 30) return {k:'soon', label: d===0 ? 'Due today' : `Due in ${d} day${d===1?'':'s'}`};
  return {k:'ok', label:`Valid to ${fmtS(v.due)}`};
}
function todayTasks(){
  const t = today();
  const meals = S.meals.map(m => ({done: !!mealFed(S,m.id,t)}));
  const doses = [];
  S.meds.filter(m=>medActive(m,t)).forEach(m => (m.times||[]).forEach(time => doses.push({done: !!doseLog(S,m,time,t)})));
  const all = meals.concat(doses);
  const done = all.filter(x=>x.done).length;
  return {done, total: all.length, pct: all.length ? done/all.length : 1};
}
function allBadgesEarned(){ return S && BADGES.every(b => S.badges[b.id]); }
function amazonPetLink(q){ return 'https://www.amazon.com/s?tag=kudiapp-20&k='+encodeURIComponent(q+' '+({dog:'dog',cat:'cat',other:'pet'}[S.pet.species]||'pet')+' food'); }
function chewyLink(q){ return 'https://www.chewy.com/s?query='+encodeURIComponent(q); }
function careStats(){
  const log = S.log;
  const meals = log.filter(l=>l.type==='meal').length;
  const meds = log.filter(l=>l.type==='med').length;
  const vaccines = log.filter(l=>l.type==='vaccine').length;
  const treats = log.filter(l=>l.type==='treat').length;
  const walks = log.filter(l=>l.type==='walk').length;
  const water = log.filter(l=>l.type==='water').length;
  const dates = [...new Set(log.map(l=>l.date))].sort();
  const firstDate = dates[0];
  const days = firstDate ? diffDays(firstDate, today()) + 1 : 0;
  const tripsComplete = S.trips.filter(t=>t.steps.length && t.steps.every(s=>s.done)).length;
  const feedCount = {};
  log.filter(l=>l.type==='meal').forEach(l=>{ feedCount[l.by]=(feedCount[l.by]||0)+1; });
  const topId = Object.keys(feedCount).sort((a,b)=>feedCount[b]-feedCount[a])[0];
  const topFeeder = topId ? (S.members.find(m=>m.id===topId)||{name:'Someone'}).name : null;
  return {meals, meds, vaccines, treats, walks, water, days, tripsComplete, topFeeder};
}
function moodOf(){
  const t = today(), now = hmToMin(nowHM());
  const late = S.meals.some(m => !mealFed(S,m.id,t) && hmToMin(m.time) + 30 < now);

}
function stageOf(){

function floatXP(n, ev){

function burst(ev, count=16){
  if (reduced()) return;
  const x = ev && ev.clientX ? ev.clientX : innerWidth/2, y = ev && ev.clientY ? ev.clientY : innerHeight/2;
  for (let i=0;i<count;i++){
    const b = document.createElement('div'); b.className='bit';
    const paw = i % 3 === 0;
    const PAL = ['#F2BBC8','#A9DEC4','#B9CCF3','#F6D58E','#D9CFF6']; b.innerHTML = paw ? `<svg viewBox="0 0 24 24" width="14" height="14" fill="#9DB9EE" aria-hidden="true">${P.paw.replace(/<path/,'<path')}</svg>` : '';

    b.style.left = x+'px'; b.style.top = y+'px';
    document.body.appendChild(b);
    const a = Math.random()*Math.PI*2, d = 60 + Math.random()*90;

  }
}

/* ---------- render ---------- */
function render(opts){
  const app = document.getElementById('app');
  if (!S || ui.ob){
    if (!ui.ob) ui.ob = {step:1, pet:{name:'',species:'dog',birthday:'',breed:'',sex:'',spayed:''}, meals:[{name:'Breakfast',time:'08:00'},{name:'Dinner',time:'19:00'}], members:[], meName:''};
    app.innerHTML = renderOnboarding();
    document.getElementById('layer').innerHTML = '';
    const rb = document.getElementById('rem'); if (rb){ rb.innerHTML = ''; rb.dataset.key = ''; }
    document.title = 'Kudi Pet Care';
    return;
  }
  inRender = true; checkReminders(); inRender = false;
  const scrollKeep = opts && opts.keepScroll ? window.scrollY : 0;
  const v = {today:viewToday, health:viewHealth, food:viewFood, travel:viewTravel, me:viewMe}[ui.tab] || viewToday;
  app.innerHTML = `<main class="${opts && opts.anim ? 'enter' : ''}">${v()}</main>${nav()}`;
  const layer = document.getElementById('layer');
  const modals = [...layer.querySelectorAll('.modal')];
  layer.innerHTML = sheetHTML();
  modals.forEach(m => layer.appendChild(m));
  const car = document.getElementById('ins'), dots = document.getElementById('insDots');
  if (car && dots){ car.addEventListener('scroll', () => { const w = car.firstElementChild ? car.firstElementChild.getBoundingClientRect().width + 12 : 1; const i = Math.round(car.scrollLeft / w); [...dots.children].forEach((d,j) => d.classList.toggle('on', j === i)); }, {passive:true}); }
  if (opts && opts.keepScroll) window.scrollTo(0, scrollKeep);
  else if (opts && opts.top) window.scrollTo(0,0);
  ui.flash = null;
  if (ui.sheet){ const first = layer.querySelector('.sheet input:not([type=radio]), .sheet select, .sheet button[data-a="confirmYes"]'); if (first) setTimeout(()=>{ try{ first.focus({preventScroll:true}); }catch(e){} }, 60); }
}

/* ---------- sample ---------- */
function makeSample(){
  const s = blank(); const t = today();
  const nino = {id:uid(), name:'Nino'}, giorgi = {id:uid(), name:'Giorgi'};
  s.sample = true;
  s.pet = {name:'Bubu', species:'dog', birthday:addMonths(t,-4), breed:'Golden retriever', sex:'female', spayed:'no'};
  s.members = [nino, giorgi];
  const b = {id:uid(), name:'Breakfast', time:'08:00', food:'Puppy kibble', portion:'110 g'}, d = {id:uid(), name:'Dinner', time:'19:00', food:'Puppy kibble', portion:'110 g'};
  s.meals = [b,d];
  const L = (type, ref, date, by, time, value) => ({id:uid(), type, ref:ref||null, date, by, time, value:value??null, at: parseKey(date).getTime() + hmToMin(time)*60000});
  for (let i=4;i>=1;i--){ const day = addDays(t,-i); s.log.push(L('meal',b.id,day,i%2?giorgi.id:nino.id,'08:10'), L('meal',d.id,day,i%2?nino.id:giorgi.id,'19:05')); }
  s.log.push(L('meal', b.id, t, giorgi.id, '08:12'));
  s.log.push(L('walk', null, t, giorgi.id, '08:40'));
  [[-21,'8.2'],[-14,'9.0'],[-7,'9.8']].forEach(([n,kg])=>s.log.push(L('weight',null,addDays(t,n),nino.id,'18:00',kg)));
  const amox = {id:uid(), name:'Amoxicillin', dose:'250 mg', times:['08:00','20:00'], start:addDays(t,-2), days:7, vet:'Dr. [Name], [Clinic]', notes:'With food'};
  s.meds = [amox];
  [-2,-1].forEach(n => { s.log.push(L('med',amox.id,addDays(t,n),nino.id,'08:05','08:00'), L('med',amox.id,addDays(t,n),giorgi.id,'20:02','20:00')); });
  s.log.push(L('med',amox.id,t,giorgi.id,'08:15','08:00'));
  s.vaccines = [
    {id:uid(), name:'Rabies', given:addDays(t,-10), repeat:12, due:addMonths(addDays(t,-10),12), notes:''},
    {id:uid(), name:'DHPPi (distemper, parvo)', given:addDays(t,-18), repeat:1, due:addDays(t,12), notes:'Puppy series, 2 of 3'},
    {id:uid(), name:'Leptospirosis', given:addDays(t,-18), repeat:1, due:addDays(t,12), notes:'Second dose'}
  ];
  s.items = [
    {id:uid(), kind:'food', name:'Puppy kibble, large breed', note:'15 kg bag lasts ~6 weeks', fav:true},
    {id:uid(), kind:'treat', name:'Soft salmon training bites', note:'Break in half', fav:true},
    {id:uid(), kind:'toy', name:'Rubber teething ring', note:'Freeze it for sore gums', fav:false}
  ];
  const tripDate = addDays(t, 131);
  const steps = tripSteps('eu', tripDate); steps[0].done = true; steps[1].done = true;
  s.trips = [{id:uid(), dest:'eu', place:'Germany', date:tripDate, steps}];
  s.xp = 240;
  s.badges = {first_meal:addDays(t,-4), streak3:addDays(t,-1), team:addDays(t,-4)};
  return {s, me:nino.id};
}

const XPOF = l => XP[l.type] || 5;
const A = {
  obStart(){ ui.ob.step = 2; render(); window.scrollTo(0,0); },

  obDelMember(d){ syncObForm(); ui.ob.members.splice(+d.i,1); render(); },
  go(d){ ui.tab = d.tab; if (d.seg){ if (d.tab==='health') ui.healthSeg = d.seg; if (d.tab==='food') ui.foodSeg = d.seg; } if (d.tab !== 'travel') ui.tripId = null; lsSet(LSTAB, ui.tab); render({anim:true, top:true}); },
  seg(d){ ui[d.k] = d.v; render({keepScroll:true}); },
  stage(d){ ui.guideStage = d.v; render({keepScroll:true}); },
  feed(d, ev){ const l = logEntry('meal', d.id); award(XP.meal, ev); burst(ev); buzz(); ui.flash = 'meal:'+d.id; commit({keepScroll:true}); toast(`${S.pet.name} is fed. Everyone can see it.`); },
  give(d, ev){ logEntry('med', d.id, d.time); award(XP.med, ev); burst(ev, 10); buzz(); ui.flash = 'dose:'+d.id+d.time; commit({keepScroll:true}); },
  quick(d, ev){ logEntry(d.k); award(XP[d.k]||5, ev); burst(ev, 8); buzz(); commit({keepScroll:true}); },
  unlog(d){ const i = S.log.findIndex(l=>l.id===d.id); if (i<0) return; const [l] = S.log.splice(i,1); award(-XPOF(l)); commit({keepScroll:true}); toast('Entry removed', () => { S.log.push(l); award(XPOF(l)); commit({keepScroll:true}); }); },
  sheet(d){ ui.sheet = {type:d.type, id:d.id||null, kind:d.kind||null, trip:d.trip||null}; render({keepScroll:true}); },
  close(){ ui.sheet = null; ui.confirm = null; render({keepScroll:true}); },
  confirm(d){
    const what = d.what, id = d.id;
    const nm = (arr) => (arr.find(x=>x.id===id)||{}).name || '';
    const map = {
      meal:{title:`Delete ${nm(S.meals)}?`, text:'The meal time and its reminders go away. Past logs stay.'},
      med:{title:`Delete ${nm(S.meds)}?`, text:'The prescription and its dose reminders are removed.'},
      vac:{title:`Delete ${nm(S.vaccines)}?`, text:'This vaccine record is removed from the health book.'},
      item:{title:`Delete ${nm(S.items)}?`, text:'It is removed from the pantry.'},
      heat:{title:'Delete this heat?', text:'Predictions are recalculated without it.'},
      trip:{title:'Delete this trip?', text:'The checklist and its progress are removed.'},
      member:{title:`Remove ${nm(S.members)}?`, text:'Their past logs stay, shown as "Someone".'},
      reset:{title: S.sample ? 'Clear the sample?' : 'Reset everything?', text: S.sample ? 'You start fresh with your own pet.' : 'Every pet record, log, badge and trip is deleted for everyone using this app.', yes: S.sample ? 'Start fresh' : 'Reset all'}
    };
    ui.confirm = Object.assign({what, id, yes:'Delete'}, map[what]);
    ui.sheet = {type:'confirm'}; render({keepScroll:true});
  },
  confirmYes(){
    const c = ui.confirm; if (!c) return;
    const rm = k => { S[k] = S[k].filter(x=>x.id!==c.id); };
    if (c.what==='meal') rm('meals');

};

function syncObForm(){

  if (g('obBday')) o.pet.birthday = g('obBday').value;

  if (g('obSex')) o.pet.sex = g('obSex').value;
  if (g('obSpay')) o.pet.spayed = g('obSpay').value;

/* ---------- forms ---------- */
function onSubmit(e){
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  const fd = new FormData(form); const v = k => (fd.get(k)||'').toString().trim();
  const kind = form.dataset.form;
  if (kind === 'obPet'){ syncObForm(); if (!ui.ob.pet.name) return; ui.ob.step = 3; render(); window.scrollTo(0,0); return; }
  if (kind === 'obMeals'){ if (!ui.ob.meals.length) return; ui.ob.step = 4; render(); window.scrollTo(0,0); return; }
  if (kind === 'obFamily'){
    syncObForm(); const o = ui.ob; if (!o.meName) return;
    S = blank();
    S.pet = Object.assign({}, o.pet);
    const mine = {id:uid(), name:o.meName};
    S.members = [mine].concat(o.members.map(n=>({id:uid(), name:n})));
    S.meals = o.meals.map(m=>({id:uid(), name:m.name, time:m.time, food:'', portion:''}));
    me = mine.id; lsSet(LSME, me);
    ui.ob = null; ui.tab = 'today';
    S.xp = 50; save(); render({anim:true, top:true});
    burst({clientX:innerWidth/2, clientY:innerHeight/3}, 28);
    toast(`Welcome! ${S.pet.name} is all set. +50 XP`);
    return;
  }
  if (kind === 'joinme'){ const n = v('name'); if (!n) return; const m = {id:uid(), name:n}; S.members.push(m); me = m.id; lsSet(LSME, me); ui.sheet = null; commit({keepScroll:true}); toast(`Welcome, ${n}!`); return; }
  if (kind !== 'sheet' || !ui.sheet) return;

const HEAT = {dog:{interval:182, length:21, watch:60}, cat:{interval:21, length:7, watch:0}};
function heatTab(){ return S && S.pet.sex !== 'male' && S.pet.spayed !== 'yes' && (S.pet.species === 'dog' || S.pet.species === 'cat'); }
function showHeat(){ return heatTab() && S.pet.sex === 'female'; }
function heatInfo(){
  const t = today(), sp = S.pet.species === 'cat' ? 'cat' : 'dog', def = HEAT[sp];
  const hs = [...S.heats].sort((a,b)=>a.start.localeCompare(b.start));
  const last = hs[hs.length-1] || null;
  const gaps = [];
  for (let i=1;i<hs.length;i++){ const g = diffDays(hs[i-1].start, hs[i].start); if (sp === 'cat' ? g >= 7 && g <= 60 : g >= 90 && g <= 400) gaps.push(g); }
  const avg = gaps.length ? Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length) : def.interval;
  let cur = false, day = 0;
  if (last){ const d = diffDays(last.start, t); if (d >= 0 && (last.end ? last.end >= t : d < def.length)) { cur = true; day = d + 1; } }
  let next = null;
  if (last && !cur){ next = addDays(last.start, avg); if (sp === 'cat' && diffDays(last.start, t) > 60) next = null; while (next && next < t && sp === 'dog') next = addDays(next, avg); if (next && next < t) next = null; }
  let watchUntil = null;
  if (sp === 'dog' && last && !cur){ const endK = last.end || addDays(last.start, def.length-1); const until = addDays(endK, def.watch); if (until >= t) watchUntil = until; }
  return {sp, hs, last, cur, day, avg, next, watchUntil, learned: gaps.length};
}

    rows.push({k:'step:'+s.id, icon:'plane', title:s.title, when:`By ${fmtS(s.due)} · trip ${fmtS(tr.date)}`,
      href: gcal(`${pet}'s trip: ${s.title}`, s.due, '10:00', 15, `${s.detail||''} Trip to ${tr.place||DESTS[tr.dest].label} on ${fmt(tr.date)}.`)}); }));
  return `<div class="scrim" data-a="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"><div class="grab"></div>
    <div class="row" style="justify-content:space-between"><h2 id="shTitle" style="margin:0">Reminders</h2><button type="button" class="iconbtn sm" data-a="close" aria-label="Close">${ic('x','ico-s')}</button></div>
    <div class="stack" style="margin-top:14px">
      <div class="eyebrow">Pop-ups while Kudi is open</div>
      <div class="list">
        ${sw('meals','Meals','When a meal is due and nobody has fed yet')}
        ${sw('meds','Medicine','Each dose the vet prescribed')}
        ${sw('vacc','Vaccines','From a week before the due date')}
        ${sw('trips','Trip deadlines','Three days before each checklist step')}
        ${showHeat()?sw('heat','Heat','A week before her next heat is expected'):''}
        ${sw('sound','Sound','A short chime with each reminder')}
        ${CAN_NOTIFY ? (Notification.permission === 'granted' ? sw('push','Phone notifications','Show reminders as notifications while Kudi is running') : `<div class="li"><div class="grow"><div class="t">Phone notifications</div><div class="s">${Notification.permission==='denied' ? 'Blocked. Allow them in your browser settings.' : 'On iPhone, add Kudi to the Home Screen first.'}</div></div>${Notification.permission==='denied' ? '' : '<button class="btn ink sm" data-a="allowNotify">Allow</button>'}</div>`) : ''}
        <div class="li"><label class="grow" for="rem_lead"><div class="t">Remind me</div><div class="s">For meals and medicine</div></label>
          <select class="in" id="rem_lead" data-rem="lead" style="width:auto;min-height:42px">${[[0,'At the time'],[10,'10 min before'],[30,'30 min before']].map(([v,l])=>`<option value="${v}" ${+REM.lead===v?'selected':''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="eyebrow" style="margin-top:6px">Still to do today</div>
      ${up.length?`<div class="list">${up.map(u=>`<div class="li"><span class="badge-ico" style="width:36px;height:36px;border-radius:12px">${ic(u.icon,'ico-s')}</span><div class="grow t" style="font-size:14px">${esc(u.text)}</div><span class="pill num">${esc(u.time)}</span></div>`).join('')}</div>`:`<div class="empty">Everything is done for today. ${esc(pet)} is happy.</div>`}
      <div class="eyebrow" style="margin-top:6px">On your phone, even when Kudi is closed</div>
      <div class="card" style="align-items:flex-start"><span class="badge-ico sun">${ic('cal')}</span><div class="grow"><div class="t">Add to Google Calendar</div><div class="s">Each one opens Google Calendar with the time and repeat already filled in. Tap Save there and your phone alerts you. Every family member adds them on their own phone.</div></div></div>
      ${rows.length?`<div class="list calrow">${rows.map(r=>`<div class="li"><span class="badge-ico" style="width:36px;height:36px;border-radius:12px">${ic(r.icon,'ico-s')}</span><div class="grow"><div class="t" style="font-size:14px">${esc(r.title)}</div><div class="s num">${esc(r.when)}</div></div><a class="btn ${opened[r.k]?'ghost':'soft'} sm" href="${esc(r.href)}" target="_blank" rel="noopener" data-cal="${esc(r.k)}">${opened[r.k]?ic('check','ico-s')+'Opened':ic('plus','ico-s')+'Add'}</a></div>`).join('')}</div>`:'<div class="empty">Add meal times, medicine or vaccines first.</div>'}
      <p class="small muted" style="margin:0">Google Calendar uses your default alert time. Set it to "At time of event" for exact feeding reminders.</p>
    </div>
  </div>`;
}
Object.assign(A, {
  week(d){ ui.week = Math.max(-8, Math.min(0, (ui.week||0) + (+d.d))); render({keepScroll:true}); },
  pat(d, ev){ ui.flash = 'pat'; burst(ev, 12); buzz(); const lines = [`${S.pet.name} loves you`, 'Tail wags: maximum', 'Best human ever', 'More scratches, please']; toast(lines[Math.floor(Math.random()*lines.length)]); render({keepScroll:true}); },
  remAct(d, ev){
    fired[d.key] = 'done'; saveFired();
    if (d.do === 'feed') A.feed({id:d.id}, ev);
    else if (d.do === 'give') A.give({id:d.id, time:d.time}, ev);
    else if (d.do === 'remGo') A.go({tab:d.tab, seg:d.seg});
    else if (d.do === 'remTrip'){ ui.tab = 'travel'; ui.tripId = d.trip; render({anim:true, top:true}); }
    checkReminders();
  },
  remSnooze(d){ fired[d.key] = Date.now() + 15*60000; saveFired(); announced.delete(d.key); checkReminders(); toast('Snoozed for 15 minutes'); },
  remDismiss(d){ fired[d.key] = 'done'; saveFired(); checkReminders(); }
});

/* ---------- family sync on the web (Vercel API) ---------- */
function newCode(){ const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let x = ''; const r = new Uint32Array(12); try { crypto.getRandomValues(r); } catch(e){ for (let i=0;i<12;i++) r[i] = Math.random()*1e9; } for (let i=0;i<12;i++) x += c[r[i] % c.length]; return x; }
async function startHttpSync(){
  if (location.protocol === 'file:') return;
  if (!subscribed) return;
  const qp = new URLSearchParams(location.search), joined = (qp.get('home') || '').toLowerCase();
  if (joined && /^[a-z0-9]{8,24}$/.test(joined)){
    if (lsGet(LSHOME) !== joined){ lsSet(LSHOME, joined); S = null; lsDel(LS); lsDel(LSME); me = null; ui.ob = null; }
    history.replaceState(null, '', location.pathname);
  }
  homeCode = lsGet(LSHOME) || newCode(); lsSet(LSHOME, homeCode);
  const url = '/api/household?id=' + homeCode;
  const get = async () => { const r = await fetch(url, {cache:'no-store'}); if (r.status === 501){ dbMissing = true; throw new Error('no-db'); } if (!r.ok) throw new Error('http ' + r.status); return (await r.json()).data; };
  let data;
  try { data = await get(); } catch(e){ if (S && !ui.ob && ui.tab === 'me') render({keepScroll:true}); return; }
  syncMode = 'shared';
  remote = {
    push: d => fetch(url, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({data:d})}).then(r => { if (!r.ok) throw new Error('http ' + r.status); }),
    del: () => fetch(url, {method:'DELETE'})
  };
  if (!S && !data) render();
  applyRemote(data, true);
  const poll = async () => { if (document.hidden || !remote) return; try { const d = await get(); if (d && JSON.stringify(d) !== lastPushed) applyRemote(d, false); } catch(e){} };
  setInterval(poll, 8000);
  document.addEventListener('visibilitychange', poll);
}

/* ---------- boot ---------- */
(function boot(){
  const raw = lsGet(LS);
  if (raw){ try { S = normalize(JSON.parse(raw)); } catch(e){ S = null; } }
  me = lsGet(LSME);
  subscribed = lsGet(LSSUB) === '1';
  const savedLang = lsGet(LSLANG); if (savedLang && STRINGS[savedLang]) lang = savedLang;
  const tab = lsGet(LSTAB); if (tab && ['today','health','food','travel','me'].includes(tab)) ui.tab = tab;
  if (S && !S.members.find(m=>m.id===me)) me = S.members[0] && S.members[0].id;
  render();
  if (!IN_ARTIFACT) startHttpSync();
  if (CAN_NOTIFY) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  // live sync through the artifact's shared store, when the viewer offers it
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('db').then(d => {
      if (!d) return;
      db = d;
      try { ref = db.doc('households/home'); } catch(e){ ref = null; return; }
      syncMode = 'shared';
      remote = {push: d => ref.set(d), del: () => ref.delete()};
      let first = true;
      ref.onSnapshot(snap => {
        const data = snap.exists ? snap.data() : null;
        if (data && !first && JSON.stringify(data) === lastPushed) return;
        const f = first; first = false;
        applyRemote(data, f);
      }, () => { syncMode = 'device'; ref = null; remote = null; if (S && !ui.ob) render({keepScroll:true}); });
      if (S && !ui.ob && ui.tab === 'me') render({keepScroll:true});
    }).catch(()=>{});
  }
  // refresh "late" states every minute
  setInterval(() => { if (S && !ui.ob && !ui.sheet && ui.tab === 'today') render({keepScroll:true}); }, 60000);
  // check for due reminders every 20 seconds and whenever the app comes back to the screen
  setInterval(checkReminders, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkReminders(); });
  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-cal]'); if (!a) return;
    let o = {}; try { o = JSON.parse(lsGet('kudi.cal') || '{}'); } catch(err){}
    o[a.dataset.cal] = Date.now(); lsSet('kudi.cal', JSON.stringify(o));
    setTimeout(() => { a.classList.remove('soft'); a.classList.add('ghost'); a.innerHTML = ic('check','ico-s') + 'Opened'; }, 300);
  });
})();

})();
</script>
